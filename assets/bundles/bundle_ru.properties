fun.curse.no-north.title = Конвейеры не на север
setting.fun-no-north-enabled.name = Включить Конвейеры не на север
setting.fun-no-north-enabled.description = Конвейеры тут на север не ходят. Никто не знает почему. Постройка конвейера вверх заканчивается предсказуемо. Работает в одиночке/хостом.
fun.no-north.message = [scarlet]Конвейеры тут на север не ходят. Никто не знает почему.[]

fun.curse.sleepy-drills.title = Сонные буры
setting.fun-sleepy-drills-enabled.name = Включить Сонные буры
setting.fun-sleepy-drills-enabled.description = Буры тоже люди: время от времени один засыпает и перестаёт работать, пока его не разбудят — кликом или просто любым юнитом, прошедшим рядом (юниты как будильники). Работает в одиночке/хостом.

fun.curse.sneeze.title = Аллергия
setting.fun-sneeze-enabled.name = Включить Аллергию
setting.fun-sneeze-enabled.description = Ваш юнит раз в пару минут чихает и отлетает на пару клеток в случайную сторону. Работает везде - юнит-то ваш.
fun.sneeze.toast = Апчхи!

fun.curse.challenges.title = Челленджи администрации
setting.fun-challenges-enabled.name = Включить Челленджи администрации
setting.fun-challenges-enabled.description = Раз в несколько минут администрация фабрики выдаёт челлендж на 60 секунд: не строить, не терять юнитов, разобрать стену, произвести юнита, убить врагов или накопить ресурс. За успех - награда, за провал - конфискация и инспекция из ползунов. Работает в одиночке/хостом.
fun.challenge.start.nobuild = [accent]ЧЕЛЛЕНДЖ: 60 секунд ничего не строить самому. Руки прочь от мыши.[]
fun.challenge.start.nolosses = [accent]ЧЕЛЛЕНДЖ: 60 секунд не потерять ни одного юнита. Берегите их.[]
fun.challenge.start.breakwall = [accent]ЧЕЛЛЕНДЖ: разобрать одну стену за 60 секунд. Любую. Не спрашивайте.[]
fun.challenge.start.makeunit = [accent]ЧЕЛЛЕНДЖ: произвести одного юнита за 60 секунд. Любой сгодится.[]
fun.challenge.start.killenemies = [accent]ЧЕЛЛЕНДЖ: уничтожить {0} вражеских юнитов за 60 секунд.[]
fun.challenge.start.hoard = [accent]ЧЕЛЛЕНДЖ: накопить {0} в ядре за 60 секунд.[]
fun.challenge.win = [lime]Челлендж выполнен! Администрация довольна: +{0} {1} доставлено в ядро.[]
fun.challenge.lose = [scarlet]Челлендж провален. Администрация В ЯРОСТИ: конфисковано {0} {1} и {2} {3}. К вашему ядру выехала инспекция.[]
fun.challenge.name.nobuild = Не строить
fun.challenge.name.nolosses = Не терять юнитов
fun.challenge.name.breakwall = Сломать стену
fun.challenge.name.makeunit = Сделать юнита
fun.challenge.name.killenemies = Убить врагов
fun.challenge.name.hoard = Накопить ресурс

setting.fun-debug-menu.name = Меню отладки (временное)

fun.curse.big-routers.title = БОЛЬШИЕ роутеры
setting.fun-big-routers-enabled.name = Включить БОЛЬШИЕ роутеры
setting.fun-big-routers-enabled.description = Новые роутеры: 3x3, 5x5, 7x7, 9x9 и 11x11. Это текстура роутера, но больше. Как и задумано сообществом. Применяется со следующего запуска игры.
block.sonka-fun-mode-router3.name = Роутер 3x3
block.sonka-fun-mode-router5.name = Роутер 5x5
block.sonka-fun-mode-router7.name = Роутер 7x7
block.sonka-fun-mode-router9.name = Роутер 9x9
block.sonka-fun-mode-router11.name = Роутер 11x11
block.sonka-fun-mode-router3.description = Это роутер.
block.sonka-fun-mode-router5.description = Это роутер побольше.
block.sonka-fun-mode-router7.description = Это ещё больший роутер.
block.sonka-fun-mode-router9.description = Роутер растёт.
block.sonka-fun-mode-router11.description = Роутер неизбежен.
block.sonka-fun-mode-router11.details = Роутер неизбежен. Всё прочее в этом мире может тебя предать — буры засыпают, постройки крутятся сами, небо плюётся кислотой, — но роутер маршрутизирует. Держись за него.

fun.curse.mega-illuminator.title = Мегаосветитель
setting.fun-mega-illuminator-enabled.name = Включить Мегаосветитель
setting.fun-mega-illuminator-enabled.description = Осветитель 3x3, который освещает ВСЮ карту, слепяще сияет даже днём, а вблизи заливает весь экран белым. Применяется со следующего запуска игры.
block.sonka-fun-mode-mega-illuminator.name = Мегаосветитель
block.sonka-fun-mode-mega-illuminator.description = ОЧЕНЬ, ОЧЕНЬ яркий. Не смотрите прямо на осветитель.
block.sonka-fun-mode-mega-illuminator.details = Где-то в чертежах «осветить местность» подчёркнуто трижды; никто не спросил, насколько. Говорят, всмотришься подольше — увидишь каждое проклятие наперёд. Прямо перед тем, как перестанешь видеть вообще.

fun.curse.survival-sandbox.title = Песочные привилегии
setting.fun-survival-sandbox-enabled.name = Включить Песочные привилегии
setting.fun-survival-sandbox-enabled.description = Предметный, жидкостный и энергетический вакуумы можно строить в выживании. Бесплатно. С 1 хп, чтобы без фокусов со стенами. Применяется со следующего запуска игры.

fun.curse.blast-generators.title = Энергия взрывчатки
setting.fun-blast-generators-enabled.name = Включить Энергию взрывчатки
setting.fun-blast-generators-enabled.description = Сжигающий и паровой генератор теперь ещё и нормально работают на взрывчатой смеси - взрывы были недоработкой дизайна и удалены. Уголь тоже работает и остаётся хорошим РАННИМ источником энергии (~480 и ~1320 энергии/с), а не прежними абсурдными 2700. Подвох: уголь теперь очень медленно ИЗНАШИВАЕТ генератор (минуты до поломки), так что в начале опирайся на уголь, а потом переходи на чистое топливо. Статы со следующего запуска; износ от угля - сразу.

fun.curse.cold-reactor.title = Индикатор врёт
setting.fun-cold-reactor-enabled.name = Включить Индикатор врёт
setting.fun-cold-reactor-enabled.description = Индикатор нагрева ториевого реактора врёт: безопасный реактор пылает оранжевым, а вот-вот готовый рвануть выглядит совершенно спокойным. Механика не тронута - пострадали только ваши глаза. Применяется со следующего запуска игры.


fun.curse.spider-genes.title = Проклятая генетика пауков
setting.fun-spider-genes-enabled.name = Включить Проклятую генетику пауков
setting.fun-spider-genes-enabled.description = Пауки меняются жизнями: токсопид теряет всё оружие и становится самым большим ползуном в мире - бежит на цель и детонирует как ториевый реактор при атаке или смерти (достаётся всем, включая своих). Ползун больше не взрывается вовсе: вместо бомбы - ослабленная паутинная пушка токсопида, воюет как обычный стрелок. Взрыв работает в одиночке/хостом; смена оружия применяется со следующего запуска. Реакторный взрыв теперь ещё и оставляет над воронкой висящее облако яда.


fun.curse.slow-projector.title = Замедляющий проектор
setting.fun-slow-projector-enabled.name = Включить Замедляющий проектор
setting.fun-slow-projector-enabled.description = Злые близнецы ускоряющего проектора в двух размерах: замедляющий проектор и замедляющий купол. Замедляют ВСЕ постройки в радиусе - вражеские и ваши, щадя только себя - и остужают вражеских юнитов. ВНИМАНИЕ: поле замедления, коснувшееся ускоряющего проектора или купола, аннигилирует оба. Применяется со следующего запуска игры.
block.sonka-fun-mode-slow-projector.name = Замедляющий проектор
block.sonka-fun-mode-slow-projector.description = Как ускоряющий проектор, только наоборот и направлен на врага.
block.sonka-fun-mode-slow-projector.details = Здесь время гнётся не в ту сторону. Поднеси к ускоряющему близнецу — и реальность подаёт жалобу: громко и с жертвами. В таком проклятом мире даже собственной скорости нельзя доверять.

fun.curse.foreshadow-nuke.title = Истинное знамение
setting.fun-foreshadow-nuke-enabled.name = Включить Истинное знамение
setting.fun-foreshadow-nuke-enabled.description = Знамение больше не разменивается на отдельные цели. При наличии энергии и боеприпасов оно заряжается 5 минут - над ним по часовой стрелке заполняется циферблат - а затем разряжается на ПОЛКАРТЫ, убивая всех юнитов в радиусе, включая ваших. Отрежьте снабжение - зарядка встанет на паузу. Знамение на карте может быть только ОДНО. Работает в одиночке/хостом.
fun.foreshadow.warning = [scarlet]Знамение заряжается. У вас десять секунд, чтобы примириться со своими решениями.[]
fun.foreshadow.discharge = [scarlet]Знамение свершилось.[]

fun.curse.diff-generator.title = Оранжевые последствия
setting.fun-diff-generator-enabled.name = Включить Оранжевые последствия
setting.fun-diff-generator-enabled.description = Дифференциальный генератор получает судьбу ториевого реактора: детонирует в реакторном масштабе при разрушении во время работы (дым оранжевый, как заказано), а заправленный генератор без криогенки сам греется к детонации - следите за красным свечением. Поля взрыва применяются со следующего запуска; нагрев работает в одиночке/хостом.

block.sonka-fun-mode-slow-dome.name = Замедляющий купол
block.sonka-fun-mode-slow-dome.description = Как ускоряющий купол, только наоборот. Аннигилирует при контакте с полем ускорения - планируйте застройку внимательно.
block.sonka-fun-mode-slow-dome.details = Чем больше поле, тем громче спор при встрече с ускорителем. Градостроительство в проклятом мире — кровавый спорт.

fun.curse.router-language.title = Язык роутера
setting.fun-router-language-enabled.name = Включить Язык роутера
setting.fun-router-language-enabled.description = Роутер - это язык, и каждый роутер на нём говорит: построишь роутер - включая большие - и его иконка улетает в чат, всем на загляденье. Роутеры строятся как обычно, просто заявляют о себе. С кулдауном, чтобы стена роутеров не засыпала чат. Работает в одиночке/хостом.
fun.challenge.win.full = [lime]Челлендж выполнен! ...но ваше ядро забито под завязку, так что считайте это моральной победой.[]

fun.curse.sacrifice-altar.title = Алтарь жертвоприношения
setting.fun-sacrifice-altar-enabled.name = Включить Алтарь жертвоприношения
setting.fun-sacrifice-altar-enabled.description = Алтарь 3x3, который требует конкретного юнита (показан над ним). Скормишь того, кого он просит — Хаос отступает; не того — Хаос растёт. При низком Хаосе принимает жертву примерно раз в минуту, а с ростом Хаоса — чаще (вплоть до вдвое чаще), потом требует уже другого юнита. Жертвы возвращают половину стоимости постройки в ядро. Если юнитов для жертвы нет — испивает ресурсы прямо из ядра (оставляя запас, чтобы не разорить базу). Исследуется в кампании; пока у твоей команды нет ни одного алтаря, Хаос слегка самоуспокаивается — чтобы ты не проиграл ещё до постройки первого. Применяется со следующего запуска игры.
block.sonka-fun-mode-sacrifice-altar.name = Алтарь жертвоприношения
block.sonka-fun-mode-sacrifice-altar.description = Требует конкретного юнита, примерно раз в минуту (чаще при росте Хаоса). Правильная жертва успокаивает Хаос — чем здоровее юнит и длиннее серия правильных жертв, тем сильнее эффект; неправильная — злит его. Поглощённые юниты возвращают половину стоимости в ядро.
block.sonka-fun-mode-sacrifice-altar.details = Говорят, мир стал жесток лишь после того, как воздвигли первый алтарь. Или алтарь — единственное, что сдерживает жестокость? Корми его. Когда небо, земля и твои же машины разом оборачиваются против тебя, сюда ты приходишь молить.
fun.altar.demand = Алтарь требует жертву: {0}.
fun.altar.demand.golden = [gold]Алтарь жаждет ЗОЛОТУЮ жертву: {0}![]
fun.altar.accept = [lime]Алтарь принял вашего {0}. Хаос отступает.[]
fun.altar.combo = [lime]Алтарь принял вашего {0}. Хаос отступает. (комбо x{1})[]
fun.altar.golden = [gold]Алтарь ПОГЛОЩАЕТ вашего {0}! Хаос резко падает.[]
fun.altar.reject = [scarlet]Алтарь ждал {0}, а получил {1}. Хаос растёт.[]
fun.altar.demand.item = Алтарь, лишённый плоти, требует {1}x {0}.
fun.altar.accept.item = [lime]Алтарь испивает {1}x {0}. Хаос отступает.[]
fun.altar.hint = нечто, что {0}, {1}, и {2}
