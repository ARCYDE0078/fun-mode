setting.fun-obituaries-enabled.name = Включить Некрологи юнитов
setting.fun-obituaries-enabled.description = У каждого юнита вашей команды есть имя. Вы узнаёте его из некролога.

fun.obituaries.message = [lightgray]{0} «{1}» пал при исполнении в точке ({2}, {3}). Нажмите G, чтобы почтить память.[]
