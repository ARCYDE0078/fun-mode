fun.settings.category = Fun Mode

fun.warning.title = Fun Mode
fun.warning.text = В этом моде бывают внезапные ОЧЕНЬ громкие звуки — убавьте громкость, если это важно.\n\nМногие проклятия меняют ванильные блоки и юнитов так, что по одним характеристикам это не очевидно. Читайте описание блока или юнита в игровой "базе данных" — там видна полная картина того, что на самом деле происходит.\n\nВАЖНО: эта версия НЕ совместима со старыми сохранениями. Создайте новое сохранение с нуля — загрузка старого не поддерживается и может сломаться непредсказуемым образом.
fun.warning.wait = Подождите {0}с...

fun.curse.mystery.title = Загадочные сообщения
setting.fun-mystery-enabled.name = Включить Загадочные сообщения
setting.fun-mystery-enabled.description = Раз в несколько минут вам любезно сообщают, что произошло что-то новое и интересное. Иногда это даже правда.

fun.mystery.1 = [accent]Только что произошло что-то новое и интересное![]
fun.mystery.2 = [accent]Не беспокойтесь об этом.[]
fun.mystery.3 = [accent]Всё в порядке. Вероятно.[]
fun.mystery.4 = [accent]Возможно, вам стоит проверить... хотя нет, неважно.[]
fun.mystery.5 = [accent]Выполнена небольшая административная корректировка.[]
fun.mystery.6 = [accent]Фабрика благодарит вас за сотрудничество.[]
fun.mystery.7 = [accent]Вы тоже это слышали?[]
fun.mystery.8 = [accent]Где-то что-то изменилось навсегда.[]

