fun.curse.graphite-batch.title = Оптовые прессы
setting.fun-graphite-batch-enabled.name = Включить Оптовые прессы
setting.fun-graphite-batch-enabled.description = Графитовый пресс и мульти-пресс работают гигантскими партиями: все входы, выходы и время крафта x100. В целом та же скорость, но они копят 100 угля и выдают 100 графита разом. Применяется со следующего запуска.

fun.curse.duo-placebo.title = Плацебо-снаряды дуо
setting.fun-duo-placebo-enabled.name = Включить Плацебо-снаряды дуо
setting.fun-duo-placebo-enabled.description = Дуо стреляет огромным светящимся снарядом со взрывом и тряской экрана. Наносит 5 урона. Применяется со следующего запуска игры.

fun.curse.mace-dragon.title = Драконье дыхание булавы
setting.fun-mace-dragon-enabled.name = Включить Драконье дыхание булавы
setting.fun-mace-dragon-enabled.description = Огнемёт булавы бьёт на 20 клеток. Пламя длиннее не выглядит - урон просто прилетает откуда-то оттуда. Применяется со следующего запуска игры.

fun.curse.jumpscare.title = Ветер
setting.fun-jumpscare-enabled.name = Включить Ветер
setting.fun-jumpscare-enabled.description = В случайный момент - ОЧЕНЬ громкий порыв ветра. Всё.

fun.curse.explosive-production.title = Взрывное производство
setting.fun-explosive-production-enabled.name = Включить Взрывное производство
setting.fun-explosive-production-enabled.description = Свежепроизведённые юниты иногда взрываются прямо у ворот завода: 20% у T1, 12%/10% у T2/T3, 6% у T4, 3% у T5. Работает в одиночке/хостом.

fun.explosive-production.message = [scarlet]{0} не прошёл контроль качества.[]

