fun.curse.party-roulette.title = Вечеринка-рулетка
setting.fun-party-roulette-enabled.name = Включить Вечеринку-рулетку
setting.fun-party-roulette-enabled.description = Время от времени крутится рулетка и выпадает ОДИН игрок в игре — его юнита накрывает коротким эффектом, который видят все: заклинило оружие, примёрз на месте, чихнул через полкарты, головокружение или (редко) удачный рывок скорости — и имя выкрикивается в чат. Раскрывается в кооперативе; в одиночке всегда выбирает тебя. Крутится чаще с ростом Хаоса. Только SP/хост.
fun.roulette.fling = [accent]🎲 Рулетка выпала на {0}[accent] — мощный чих отправляет его в полёт![]
fun.roulette.jam = [accent]🎲 Рулетка выпала на {0}[accent] — оружие ЗАКЛИНИЛО![]
fun.roulette.freeze = [accent]🎲 Рулетка выпала на {0}[accent] — примёрз на месте![]
fun.roulette.dizzy = [accent]🎲 Рулетка выпала на {0}[accent] — головокружение![]
fun.roulette.lucky = [lime]🎲 Рулетка выпала на {0}[lime] — УДАЧА! Рывок скорости![]
fun.curse.cursed-weather.title = Проклятая погода
setting.fun-cursed-weather-enabled.name = Включить Проклятую погоду
setting.fun-cursed-weather-enabled.description = Небо оборачивается против тебя. Ванильная погода карты может перерасти в злую версию: ДОЖДЬ — в ЛИВЕНЬ (силовые узлы коротят), затем в ГРОЗУ (молнии); СНЕГ — в БУРАН (без источника тепла рядом всё замерзает — постройка со шлаком или горючим); безобидная ПЕСЧАНАЯ БУРЯ — в ПЕСЧАНЫЙ ШТОРМ (юниты вязнут и почти ничего не видят); СПОРЫ — в СПОРОВОЙ ШТОРМ (истощение + споровое замедление). Вдобавок случайные БЕДСТВИЯ приходят сами: КИСЛОТНЫЙ ДОЖДЬ разъедает всё, что не под силовым проектором (тем вероятнее, чем больше заводов), ЭЛЕКТРОШТОРМ засыпает поле молниями, СОЛНЕЧНАЯ ВСПЫШКА сжигает юнитов не под проектором, а ЗНОЙ перегревает юнитов до огня. Кислота и зной не приходят на снежные секторы. У каждого явления есть свой сектор кампании, в брифинге которого о нём предупреждают. Одно бедствие за раз. Только SP/хост.

fun.curse.crash-pads.title = Падающие площадки
setting.fun-crash-pads-enabled.name = Включить Падающие площадки
setting.fun-crash-pads-enabled.description = Время от времени неисправная ВРАЖЕСКАЯ пусковая площадка падает с неба и разбивается о твой сектор — вместе с грузом. Сгущается тень, площадка с воем несётся вниз, и удар зависит от того, что она везла: ВЗРЫВЧАТКА рвётся как бомба, ПИРАТИТ или УГОЛЬ разбрасывают огонь, СПЛАВ разряжается вспышкой молний, а инертный груз просто грохается в облаке пыли. Случайная часть уцелевшего груза идёт трофеем прямо в твоё ядро (бесплатные ресурсы) — но обломки могут рухнуть на базу, а взрывоопасный груз (взрывчатка, пиратит) детонирует от собственного взрыва или огня, так что собирать нечего. Только SP/хост.
fun.crashpad.incoming = [orange]Неисправная вражеская пусковая площадка падает на твой сектор — в укрытие![]
fun.crashpad.loot = [lime]С обломков собрано: +{0} {1}.[]
fun.crashpad.lost = [lightgray]Груз ({0}) с обломков потерян — ядро заполнено.[]
fun.crashpad.burned = [lightgray]Взрывоопасный груз сдетонировал при ударе — собирать нечего.[]
fun.lore.crashpad.sector = Добывающий форпост — сплошной пусковой трафик и грузы. Здесь небо роняет сюрпризы: неисправные вражеские ПУСКОВЫЕ ПЛОЩАДКИ порой разбиваются о сектор вместе с грузом. Всё, что уцелело в трюме, — твой трофей, но взрывоопасный груз (взрывчатка, пиратит, сплав) рвётся там, где упал. Поглядывай на небо.

fun.curse.enemy-loot.title = Трофеи с врагов
setting.fun-enemy-loot-enabled.name = Включить Трофеи с врагов
setting.fun-enemy-loot-enabled.description = Каждый погибший вражеский юнит оставляет ТРОФЕЙ — случайную часть материалов, из которых он был собран, прямиком в твоё ядро. Чем крупнее и дороже юнит, тем больше добыча; в кампании собираются только уже изученные ресурсы. Небольшая боевая экономика: оборона, что незаметно кормит твою фабрику. В кампании фичу сперва надо открыть — исследуй технологию «Протокол утилизации» (в дереве под сепаратором). Только SP/хост.
block.sonka-fun-mode-salvage-protocol.name = Протокол утилизации
block.sonka-fun-mode-salvage-protocol.description = Перерабатывающие станки и дроны-мусорщики, что разбирают павших врагов на запчасти. Изучи, чтобы открыть ТРОФЕИ С ВРАГОВ: каждый погибший враг роняет случайную часть материалов, из которых был собран, прямо в ядро. Технология Fun Mode — не постройка, и нужна только в кампании.
block.sonka-fun-mode-fun-tech-hub.name = Технологии Fun Mode
block.sonka-fun-mode-fun-tech-hub.description = Собственная линия проклятых наук мода. Изучи, чтобы открыть ветку Fun Mode: контрмеры, укрощающие хаос, и инструменты, что обращают его в твою пользу. Не постройка.
block.sonka-fun-mode-wreck-recovery.name = Утилизация обломков
block.sonka-fun-mode-wreck-recovery.description = Салваж-маяки и спасательные бригады для сбитой техники. Изучи, чтобы неисправные вражеские ПУСКОВЫЕ ПЛОЩАДКИ начали падать на твой сектор — с грузом и опасностями. Технология Fun Mode — не постройка.
block.sonka-fun-mode-morale-doctrine.name = Боевой устав
block.sonka-fun-mode-morale-doctrine.description = Муштра, субординация и стойкость духа. Изучи, чтобы резко снизить, как часто твои юниты ДЕЗЕРТИРУЮТ. Технология Fun Mode — не постройка.
block.sonka-fun-mode-chaos-dampener.name = Гаситель хаоса
block.sonka-fun-mode-chaos-dampener.description = Стабилизирующие поля против наползающего безумия. Изучи, чтобы замедлить рост шкалы ХАОСА. Технология Fun Mode — не постройка.
block.sonka-fun-mode-drill-alarms.name = Будильники для буров
block.sonka-fun-mode-drill-alarms.description = Клаксоны и сменные мастера для твоих буров. Изучи, чтобы буры засыпали куда реже. Технология Fun Mode — не постройка.
block.sonka-fun-mode-gyro-stabilizers.name = Гиростабилизаторы
block.sonka-fun-mode-gyro-stabilizers.description = Инерционные подвесы, что держат постройки повёрнутыми туда, куда ты поставил. Изучи, чтобы постройки куда реже сами разворачивались. Технология Fun Mode — не постройка.
block.sonka-fun-mode-weatherproofing.name = Погодная защита
block.sonka-fun-mode-weatherproofing.description = Усиленные корпуса и штормовые ставни. Изучи, чтобы смягчить урон от кислотного дождя, солнечных вспышек и ударов молний. На метель, песчаную бурю, споровую бурю и тепловую волну не влияет — они работают как обычно. Технология Fun Mode — не постройка.
block.sonka-fun-mode-safety-1.name = Техника безопасности I
block.sonka-fun-mode-safety-1.description = Основы: как стоять рядом со стеной, не касаясь её, и с какого конца у двигателя горячо. Чисто церемониальная бумажка, но красиво смотрится на стене рядом с кофемашиной.
block.sonka-fun-mode-safety-2.name = Техника безопасности II
block.sonka-fun-mode-safety-2.description = Падающие обломки, электрическая дуга и правильный крик, если и то и другое случилось одновременно.
block.sonka-fun-mode-safety-3.name = Техника безопасности III
block.sonka-fun-mode-safety-3.description = Целый раздел про горючую пыль, написанный явно тем, кто когда-то работал у графитового пресса.
block.sonka-fun-mode-safety-4.name = Техника безопасности IV
block.sonka-fun-mode-safety-4.description = Техника безопасности на воде для операторов помп. Утонуть насосу это не мешает — ничто не мешает — но зато кто-то подписал нужную бумажку.
block.sonka-fun-mode-safety-5.name = Техника безопасности V
block.sonka-fun-mode-safety-5.description = Радиация, тепловой разгон и «почему РТГ-генератор так светится». Присутствие обязательно для всех, кто стоит в радиусе поражения — а в этом моде это все.
block.sonka-fun-mode-safety-6.name = Техника безопасности 6
block.sonka-fun-mode-safety-6.description = Нумерация перескакивает через «VI», потому что у того, кто печатал сертификаты, на середине кончились римские цифры, и это так и не исправили. Как и любой курс в этой программе, он обязателен сразу после открытия: затянешь дольше одного следующего сектора — твои юниты решат, что подчиняться больше не обязательно, и начнут переходить на сторону врага.
block.sonka-fun-mode-safety-7.name = Техника безопасности VII
block.sonka-fun-mode-safety-7.description = Продвинутая техника безопасности при стрельбе — для турелей, которые иногда забывают, где у них «вперёд».
block.sonka-fun-mode-safety-8.name = Техника безопасности VIII
block.sonka-fun-mode-safety-8.description = Обращение с взрывчатыми материалами, целиком изложенное в прошедшем времени выжившим инструктором.
block.sonka-fun-mode-safety-9.name = Техника безопасности IX
block.sonka-fun-mode-safety-9.description = Повторный курс. Все уверяют, что он им не нужен. Он нужен всем.
block.sonka-fun-mode-safety-10.name = Техника безопасности X
block.sonka-fun-mode-safety-10.description = Финальный сертификат. По сути ничего не меняет, но церемония выпуска очень красивая, и на ней ещё никто не погиб.
fun.weather.acid.start = [lime]Кислотный дождь! Коррозия разъедает всё, что не под силовым проектором.[]
fun.weather.acid.end = [lightgray]Кислотный дождь стихает.[]
fun.weather.downpour = [cyan]Дождь усиливается в ЛИВЕНЬ — силовые узлы начинают коротить![]
fun.weather.storm = [yellow]Разражается ГРОЗА — молнии хлещут по полю![]
fun.weather.rain.end = [lightgray]Гроза проходит.[]
fun.weather.blizzard.start = [cyan]Снегопад перерастает в БУРАН — без источника тепла рядом всё замерзает.[]
fun.weather.blizzard.end = [lightgray]Буран утихает.[]
fun.weather.electric.start = [violet]Надвигается электрошторм — молнии без передышки хлещут по полю![]
fun.weather.electric.end = [lightgray]Электрошторм проходит.[]
fun.weather.sandstorm.start = [orange]Песчаная буря сгущается в ПЕСЧАНЫЙ ШТОРМ — юниты вязнут и почти ничего не видят.[]
fun.weather.sandstorm.end = [lightgray]Песчаный шторм оседает.[]
fun.weather.solar.start = [gold]Вспыхивает солнечная вспышка — радиация сжигает всё, что не под силовым проектором.[]
fun.weather.solar.end = [lightgray]Солнечная вспышка угасает.[]
fun.weather.heat.start = [orange]Наваливается зной — юниты перегреваются и загораются на открытом месте.[]
fun.weather.heat.end = [lightgray]Зной спадает.[]
fun.weather.spore = [purple]Споры сгущаются в СПОРОВОЙ ШТОРМ — истощение и споровое замедление душат поле![]
fun.weather.spore.end = [lightgray]Споровой шторм рассеивается.[]

# --- Проклятый лор кампании: «details» блоков в базе (виден после изучения) ---
fun.lore.thorium-reactor = «Доверяй датчику», — говорили прошлой смене. Он пылает жарче всего, когда холоден как камень, и спокоен, когда на вдох от того, чтобы унести весь район с собой. Прошлая смена — причина, по которой мы это рассказываем.
fun.lore.impact-reactor = Он не гудит. Он рычит, и земля рычит в ответ — тем сильнее, чем ближе ты решишься встать. Фундаменты трескаются. Нервы трескаются первыми.
fun.lore.rtg-generator = Тихий, неутомимый и незаметно поджаривающий всё живое, что задержится рядом слишком долго. У энергии есть цена; здесь её платят рентгенами.
fun.lore.thermal-generator = «Ставь на источник и уходи», — сказано в мануале. Не упомянули, что будет, когда охлаждение тоже уйдёт. Оно греется, потом сильнее, потом никак.
fun.lore.pump-drown = Плавать их никто не учил. Время от времени вода просто побеждает, и насос уходит на дно насовсем — на глубокой воде спор решается быстрее, чем на мелкой.
fun.lore.plastanium-smoke = Прессуй пластаний достаточно долго, и процесс забывает быть чистым. От каждого работающего блока валит клубящийся чёрный дым, и стоит подышать им вблизи — весь мир вокруг темнеет вместе с ним.
fun.lore.combustion-generator = Дай ему топливо, что должно его убить, — и оно мурлычет. Дай честный уголь, под который его строили, — и оно дуется, искрит и глохнет. Здесь ничего не работает так, как на этикетке.
fun.lore.steam-generator = Пьёт взрывную жижу и просит добавки. Предложи простой уголь — оскорбится, громко. Топлива этого мира поменялись манерами.
fun.lore.graphite-press = Терпение монаха, аппетит дракона. Молча глотает сотню угля, потом разом выхаркивает сотню графита. Итог тот же. Нервы совсем другие.
fun.lore.differential-generator = Держи криожидкость в потоке. Пересохнет — оно не просто встанет: греется, светится и решает вопрос само, оранжевым. Где-то реактор берёт на заметку.
fun.lore.duo = Весь грохот и ярость осадного орудия вокруг удара брошенного камешка. Враг вздрагивает. В этом, целиком, весь план.
fun.lore.foreshadow = Оно больше не целится. Оно ждёт. Дай энергию и снаряды — и оно отсчитывает пять долгих минут, а потом половины мира, своих и чужих без разбора, просто нет. Знамение не делает исключений.
fun.lore.factory-safety = Контроль качества здесь мягко описывают как «стремление». Порой свежий юнит встречает мир и тут же его покидает — прямо на пороге. Отойди при выдаче.
fun.lore.conveyor = Присмотрись подольше — и поклянёшься, что груз едет против шерсти. Это не так. Просто твои глаза — ещё одна вещь, которой здесь больше нельзя доверять.
fun.lore.no-north = Одно направление здесь попросту под запретом. Лента, посмевшая повернуться строго на север, не заклинивает и не встаёт — она исчезает с карты целиком, вместе с грузом. Почему это устроено именно так, никто и никогда не записал.

# --- Проклятый лор кампании: переделанные крафтеры (details в базе) ---
fun.lore.factory.silicon = Кремниевая печь и тигель начали играть в кости с каждой партией: то печь перенапрягается и подпаливает сама себя, то просто тихо удваивает выплавку. Какой выпадет бросок — заранее не скажешь.
fun.lore.factory.surge-smelter = Время от времени сплав внутри не столько доваривается, сколько разряжается — треск молнии прямо от чана, и самой печи это тоже даром не проходит.
fun.lore.factory.phase-weaver = Ткань доводится не всегда тихо. Порой реальность вокруг станка икает, и всё, что стояло рядом, отшвыривает прочь.
fun.lore.factory.pyratite-mixer = Смешивать зажигательный порошок никогда не было по-настоящему безопасно, и этот смеситель этого не скрывает: порой партия вспыхивает раньше срока, и он хлебает собственный огонь. Вода или холод рядом держат его в узде.
fun.lore.factory.blast-mixer = Иногда смеситель решает, что состав готов чуточку раньше срока. Убедиться в обратном ему не удаётся — как и всему, что стояло рядом.
fun.lore.factory.cryofluid-mixer = Он больше не просто держит хладагент — он сочится холодом на всё вокруг, замедляя соседние машины до черепашьего темпа. Поднеси что-то по-настоящему горячее — и холод отступает.
fun.lore.factory.melter = Жар больше не остаётся внутри тигля. Соседние машины тихо подгорают от остаточного тепла — если рядом нет чего-то достаточно холодного, чтобы его унять.
fun.lore.factory.spore-press = Дымка, что он выжимает, не просто дурно пахнет. У всего живого, что задержится в облаке, ноги становятся ватными и медленными.
fun.lore.factory.pulverizer = У него одна громкость — оглушительная. Время от времени, безо всякого повода, он выдаёт грохот, разносящийся по всей базе.
fun.lore.factory.coal-centrifuge = Он раскручивает угольную пыль в неподвижное чёрное облако, что густеет чем дольше работает, — и чем ближе ты стоишь, тем меньше видишь собственную базу.
fun.lore.factory.separator = Он завёл привычку оставлять себе долю — порой клочок металлолома оседает в его же бункере, прежде чем остальное поедет дальше.
fun.lore.factory.disassembler = Разборка порой удаётся чуть лучше, чем нужно: иногда находится лишний клочок металлолома, а изредка — крупица пластания или фазоткани, которых туда никто не закладывал.
fun.lore.factory.kiln = Он больше не просто обжигает кирпич — жар выплёскивается наружу и ускоряет всё, что стоит рядом, попутно немного подпаливая. Залей огонь — и он просто тёплый.

# --- Проклятый лор кампании: всё остальное, что мы изменили (details в базе) ---
fun.lore.router-language = Каждый маршрутизатор на этой линии выучил ровно одно слово и норовит объявить о себе, едва достроившись, — гордая иконка на весь чат, спросили его об этом или нет.
fun.lore.big-router = Кто-то увеличил обычный маршрутизатор, не спросив зачем. Работает он точь-в-точь как оригинал во всём, что имеет значение, — это всё ещё просто маршрутизатор, — только теперь занимает куда больше места, чтобы это доказать.
fun.lore.chaos-stabilizer = Не тревожная кнопка — памятник. Он даже не даст заложить фундамент, пока в секторе остаётся хоть один враг, а стоит его накормить и запустить — он не столько усмиряет хаос, сколько отказывается признавать его существование. Дай сбоить питанию или пусти врага обратно в сектор — и он немедленно выскажет своё несогласие.
fun.lore.landing-pad = Где-то там вражеская версия этой площадки регулярно ломается по расписанию. Рано или поздно неисправная сдаётся прямо в полёте и падает в твой сектор вместо своего — подарок, если только груз не из тех, что взрываются при посадке.
fun.lore.chaos-dampener = Гнуть фазоткань — значит мириться с реальностями, которые немного не совпадают друг с другом, а это, как выяснилось, ровно то, что нужно, чтобы замедлить рост мирового хаоса. Изучи фокус — и подъём замедлится; сам по себе он не остановится никогда.
fun.lore.gyro-stabilizers = Точность обработки здесь ни при чём с пластанием и всё — с постройками, что никак не перестанут сами по себе поворачиваться в новые стороны. Исследование не лечит эту вертлявость — оно лишь держит ориентацию куда стабильнее.
fun.lore.salvage-protocol = Как только этот трюк освоен, ничто больше не гибнет бесплатно. Каждый павший враг оставляет долю того, из чего был построен, — прямиком в твои закрома, если ты уже сам разобрался, как использовать этот материал.
fun.lore.morale-doctrine = Устав не может навсегда удержать солдата от дезертирства — ничто не может, — но даёт куда больше причин остаться. Пара «дэггеров» рядом тоже помогает, да и присмотр короля никогда не повредит.
fun.lore.drill-alarms = Оснасти его нормальной сигнализацией — и он куда реже клюёт носом посреди смены. Гарантии всё равно нет: разбудить бур, решивший вздремнуть, способен только проходящий мимо юнит, ничто другое.
fun.lore.void = Теперь строится бесплатно, где угодно, — это только справедливо, ведь всё, что он умеет, — заставлять вещи исчезать. Один хороший удар — и исчезнет уже он сам, эти штуки никто не проектировал на прочность.
fun.lore.mega-illuminator = Кто-то воспринял «побольше света» как личный вызов и полностью потерял чувство меры. Под напряжением он не столько освещает комнату, сколько стирает саму возможность хоть что-то разглядеть рядом с ним — зрение возвращается, стоит увеличить расстояние или погасить свет.
fun.lore.slow-field = Нелюбимый близнец силового проектора ускорения, построенный специально для обратной работы. Всё поблизости — включая своих, тут не разбирают — вязнет в поле до черепашьего темпа. Дай ему коснуться настоящего поля ускорения — и обе машины решат спор раз и навсегда.

# --- Проклятый лор кампании: брифинги секторов (какая погода грозит биому) ---
fun.lore.sector.frozen-forest = Снежный край. Когда поднимается ветер, снегопад густеет и заворачивает вбок в БУРАН: каждый юнит на открытом месте ЗАМЕРЗАЕТ, а постройки застывают — если рядом нет постройки с теплом. Всё, что работает с УГЛЁМ или горючим — сжигающий генератор, пресс на угле, — держит округу оттаявшей.
fun.lore.sector.salt-flats = Открытая пустыня, негде укрыться от неба. Здешние песчаные бури могут сгуститься в слепящий ПЕСЧАНЫЙ ШТОРМ: юниты вязнут до черепашьего шага, а видимость по всему полю падает почти до нуля.
fun.lore.sector.overgrowth = Споровой край. Споры в воздухе могут сгуститься в СПОРОВОЙ ШТОРМ, накладывающий ИСТОЩЕНИЕ и СПОРОВОЕ ЗАМЕДЛЕНИЕ на каждого юнита на открытом месте, высасывая силы и заставляя еле ползти.
fun.lore.sector.ruinous-shores = Побитый штормами берег. Дождь тут может разрастись в ЛИВЕНЬ — куда сильнее, и настолько, что твои СИЛОВЫЕ УЗЛЫ скачут напряжением и перегорают один за другим. Держи запасные перемычки.
fun.lore.sector.windswept-islands = Архипелаг вечного дождя. Здесь дождь дорастает до самой ГРОЗЫ: телеграфируемые разряды МОЛНИЙ бьют с неба по юнитам и постройкам. Следи за зарядом перед ударом.
fun.lore.sector.tar-fields = Что-то в этом воздухе превращает дождь в отраву. КИСЛОТНЫЙ ДОЖДЬ падает зелёным и едким, разъедая каждого юнита и каждую постройку, не укрытую под СИЛОВЫМ ПРОЕКТОРОМ, — и чем больше у тебя заводов, тем чаще он идёт.
fun.lore.sector.stained-mountains = Открытые хребты притягивают гнев неба. Тут может встать ЭЛЕКТРОШТОРМ — без дождя, лишь непрерывный, безостановочный град МОЛНИЙ по всему полю.
fun.lore.sector.nuclear-complex = Комплексу не привыкать к радиации — только эта приходит с неба. Над ним может вспыхнуть СОЛНЕЧНАЯ ВСПЫШКА: слепящие импульсы, СЖИГАЮЩИЕ каждого юнита, кто не укрыт под СИЛОВЫМ ПРОЕКТОРОМ. Только щит спасает плоть и металл.
fun.lore.sector.desolate-rift = Выжженная, безжизненная пустошь. Над ней может лечь ЗНОЙ — сам воздух готовит, и юниты, оставшиеся на открытом месте, медленно ПЕРЕГРЕВАЮТСЯ и загораются.

# --- Проклятый лор кампании: переделанные турели (details в базе) ---
fun.lore.turret.scatter = Она перестала промахиваться. Никто её не учил; однажды она просто отказалась. Экипажам от этого не спокойнее, а тревожнее.
fun.lore.turret.scorch = Раскаляется так, что поджигает сама себя, — и бьёт вдвое сильнее за эту привилегию. Держи воду рядом или дай ей гореть ради урона.
fun.lore.turret.hail = Теперь закидывает снаряды прямо за горизонт. То, что падает, — скорее слух, чем снаряд, но падает оно рано или поздно везде.
fun.lore.turret.ripple = Обменяла дальность на вес. На расстоянии её можно не бояться, но вблизи всё расплющивают снаряды, что падают как наковальни.
fun.lore.turret.fuse = Выдаёт стену свинца, бьющую как толчок бога, — враги не столько гибнут, сколько улетают прочь с карты.
fun.lore.turret.salvo = Выпускает двадцать жирных снарядов за миг, потом целую минуту стоит и перезаряжается, насвистывая. Пир, а затем долгий голод.
fun.lore.turret.swarmer = У её ракет развилась боязнь обязательств. Они бегут от того, на кого навелись, и детонируют, только когда их загонит в угол что-то крупное; мелкое и быстрое они игнорируют.
fun.lore.turret.lancer = Перекована в рельсотрон. Раскручивается медленно и поворачивается как амбарная дверь, но при выстреле всё, стоящее в линии, прошивается разом.
fun.lore.turret.wave = Её струя почти не жалит — пока намокший враг не начнёт проводить ток, и турель бьёт молнией по мокрым. Каждый импульс ещё и отталкивает промокших.
fun.lore.turret.tsunami = Каждые несколько секунд она перестаёт целиться и просто выплёскивает море — широкую рушащуюся стену воды, окатывающую всё в секторе.
fun.lore.turret.cyclone = Стреляет себе, пока не раскалится, потом выпускает всё одним яростным порывом — бурей своей же шрапнели и толчком, что расчищает поле, — и стынет, дуясь, пока не зарядится снова.
fun.lore.turret.meltdown = Её луч больше не просто жжёт — он проплавляет канал прямо по линии огня, готовя всё и всех, кто попал на пути. Втрое злее.
fun.lore.turret.spectre = Слишком любит своё дело. Чем больше стреляет, тем горячее и быстрее, а выстрелы трещат молнией — ровно до того, как она сжигает саму себя и трескается.
fun.lore.turret.arc = Захлёбывается по мере нагрева, стреляя всё медленнее. Вытерпи это — и оно окупится одним широким, яростным разрядом молний.
fun.lore.turret.segment = Быстрее на курок, чем была, — и с тем же успехом собьёт один из ТВОИХ снарядов, что и вражеский. Наполовину гений, наполовину обуза.
fun.lore.turret.parallax = Больше не утруждается стрелять по летающим. Она просто не пускает их близко — тихий пузырь, выталкивающий всё, что в воздухе, обратно на открытое место.

# --- Проклятый лор кампании: переделанные юниты (details в базе) ---
fun.lore.unit.dagger = Стал шустрее на ногах, да ещё и злее с этим — попади в упор, и урон будет в разы больше заявленного, спадая до обычного по мере удаления.
fun.lore.unit.mace = Его пламя больше не просто жжёт — оно ещё и толкает. Всё, что попало в струю, отбрасывает назад и поджигает.
fun.lore.unit.mace-dragon = Его пламя обзавелось настоящей дальностью — целых 20 клеток драконьего дыхания, и выглядит соответствующе.
fun.lore.unit.fortress = Постой на месте подольше — и он окопается: золотые искры, тройной эффективный запас прочности, урон выше на 40%. Сделай шаг — и всё это спадёт.
fun.lore.unit.scepter = Королевская особа собирает свиту — союзники рядом получают ускорение. А оставь его совсем без подданных — надуется и вовсе откажется стрелять.
fun.lore.unit.reign = На команду может быть только один reign. Появись второй — старший тут же отрекается: умирает на месте, чтобы новый наследник занял трон.
fun.lore.unit.nova = Его исцеляющий импульс — заодно маленькая сверхновая: то же самое свечение, что лечит союзников, слепит и истощает любого врага, попавшего во вспышку.
fun.lore.unit.pulsar = Пульсирует по строгому расписанию. Смотри, как несколько секунд разгорается свечение, — и можно рассчитать момент точно: затем молния и разряд статики по всем поблизости.
fun.lore.unit.quasar = Самый яркий объект на поле боя, буквально — ходячий прожектор, чей луч бьёт сильнее и дальше, но за счёт куда более долгой перезарядки.
fun.lore.unit.vela = Названа в честь паруса не просто так — по карте гуляет общий ветер, и каждая vela несётся по ветру, а против него ползёт.
fun.lore.unit.corvus = Настоящая падальщица. Любая смерть поблизости кормит её долей здоровья, время от времени она каркает, а слишком приблизившийся вражеский летун может её спугнуть — вздрогнет и собьёт прицел.
fun.lore.unit.atrax = Самый смертоносный паук в мире, и это заметно — всё, что умирает в её досягаемости, лопается облаком чумы, а если кто-то умрёт уже внутри этого облака — лопнет снова. Целая стая может сдетонировать цепью.
fun.lore.unit.spiroct = Её яд бьёт мгновенно, и примерно каждое третье попадание конденсируется в небольшое ядовитое облако прямо в точке удара — разъедает всех внутри, кроме своих.
fun.lore.unit.arkyid = Матриарх стаи — соседние пауки её команды получают ускорение в её присутствии. Но раньте её как следует — и она начнёт хромать, вилять с курса и может вовсе застыть на месте.
fun.lore.unit.flare = Время от времени выпускает небольшую самонаводящуюся ракету по ближайшей цели, юниту или зданию, и оставляет место попадания гореть.
fun.lore.unit.horizon = Не может остановиться — постоянно тянет вперёд, стоит замедлиться, — и его бомбы разделяют эту тягу, всегда перелетая цель на пару клеток.
fun.lore.unit.zenith = Теперь бьёт строго сверху — его ракеты едва вылетают за нос корабля, зато втрое сильнее и поджигают цель.
fun.lore.unit.antumbra = Два полупрозрачных фантома медленно кружат вокруг неё, и часть снарядов, летящих в неё, вместо этого поглощает один из них — крепка против пуль, хотя лучи проходят сквозь призраков насквозь.
fun.lore.unit.eclipse = По своему расписанию она выпускает слепящую корону, разоружающую и истощающую всё поблизости, — заранее видно по нарастающему чёрно-золотому свечению. А пока жива хоть одна где угодно, само солнце меркнет и все солнечные панели работают хуже.
fun.lore.unit.mono = Одиночка — пока на карте только один mono, он копает как шестнадцать разом, да ещё и ускоренно. Стоит появиться второму — оба падают до обычной скорости.
fun.lore.unit.poly = Мастер на все руки, не доводящий ничего до конца — предоставленный себе, он то и дело получает новое случайное задание, не успев закончить прошлое.
fun.lore.unit.mega = Помешанный медик — его "атаки" на самом деле лечат врагов поблизости. В качестве компенсации он ещё и излучает постоянную ауру исцеления на юнитов своей команды.
fun.lore.unit.quad = Теперь всё по четыре — каждый заход на бомбёжку сбрасывает плотную серию из четырёх бомб вместо одной, за счёт куда более долгой перезарядки.
fun.lore.unit.oct = Под постоянным обстрелом он выпускает облако чернил — истощает и замедляет попавших внутрь врагов, а заодно забивает их турели.
fun.lore.unit.risso = Славится шрамами за всю жизнь, и дерётся под стать им — упав ниже половины здоровья, начинает биться отчаяннее: несёт щит и прибавку в скорости, пока остаётся в таком состоянии.
fun.lore.unit.minke = Самый маленький и любопытный из усатых китов — стоит врагу подойти ближе, и он не удерживается от рывка поближе рассмотреть, всплеск скорости.
fun.lore.unit.bryde = Хищник-выпад — стоит скопиться рядом достаточному числу врагов, и он не сдержится: рывок скорости и урона с ударом водяного столба, а затем отдых перед следующим разом.
fun.lore.unit.sei = Один из самых быстрых китов — если рядом добить врага, у него взыграет кровь: на несколько секунд получает всплеск скорости и усиленные удары (овердрайв с золотыми искрами).
fun.lore.unit.omura = Славится своей асимметричной окраской — и оправдывает славу, периодически переключаясь между тёмной, бронированной, медленной фазой и бледной, хрупкой, быстрой.
fun.lore.unit.retusa = Хищная пузырчатая улитка — никакого закапывания: раз в одну-две секунды она просто бросается на ближайшего врага в радиусе досягаемости, резкий рывок скорости в его сторону.
fun.lore.unit.oxynoe = Крадёт хлоропласты, а раз за жизнь — и собственный хвост: падение до критического здоровья запускает самоампутацию — всплеск скорости и миг настоящей неуязвимости, а расплата — долгая вялость после (никакого постоянного вреда, просто пара очень медленных минут).
fun.lore.unit.cyerce = Её жгучие клетки в церата не ждут конца боя — всё, что умирает в её досягаемости, оставляет по себе их клочок, токсично-зелёное облако прямо над трупом.
fun.lore.unit.aegires = Маленькая, ярко окрашенная и совсем не приятная на укус — всё, что подошло достаточно близко, чтобы её укусить, получает яд в ответ.
fun.lore.unit.navanax = Пожиратель слизней — раненый, он подгрызает союзного слизня помельче ради капли его здоровья (никогда не больше 40% от того, что было у жертвы) и лечится в разы больше, чем откусил. Его ЭМИ-пушка к тому же разгоняет союзное строительство сильнее обычного.
fun.lore.unit.alpha = Самый слабый из троих, всегда высыпающийся из ядра толпой — то и дело на миг становится неуязвимым без всякой причины, как помехи в распадающейся частице.
fun.lore.unit.beta = Каждая "бета-сборка" в момент появления бросает кубик на свой личный, постоянный статус-эффект — бафф или дебафф, выбранный раз и на всю жизнь, так что двух одинаковых бет не бывает.
fun.lore.unit.gamma = Сильнейшая из троих — и ей даже не нужно целиться: она пассивно испускает небольшой урон по всему, что стоит достаточно близко.
fun.lore.unit.toxopid = Полностью отказалась от оружия ради одного огромного самоубийственного рывка — сближается с целью и детонирует как ториевый реактор, взрывом, что не щадит никого рядом, даже свою команду. Кратер после этого ещё и тлеет ядовитым газом.
fun.lore.unit.crawler = Больше не взрывается — вместо бомбы получил куда более слабую копию паутинной пушки токсопида и теперь дерётся как обычный наземный юнит, а не ходячая мина.
fun.chaos.storm = [orange]Хаос нарастает — держись.[]
fun.chaos.overload = [scarlet]ПЕРЕГРУЗКА ХАОСА — что-то на базе выходит из строя![]

fun.curse.chaos-stabilizer.title = Стабилизатор Хаоса
setting.fun-chaos-stabilizer-enabled.name = Включить Стабилизатор Хаоса
setting.fun-chaos-stabilizer-enabled.description = Дорогой энд-гейм блок, построить который можно только в секторе, где сейчас нет вражеских юнитов. Постоянно потребляя ресурсы, энергию и криожидкость, он не просто снижает Хаос как алтарь — он полностью его подавляет, обнуляя уровень и останавливая все эффекты, завязанные на хаос. Стоит пересохнуть хотя бы одному из трёх ресурсов — и Хаос снова начинает расти оттуда, где остановился. Это памятник победе, а не крепость: если враги всё же вернутся в сектор, блок не выдержит и взорвётся (мощный урон по area, сам блок уничтожается) вместо того, чтобы просто отключиться.
fun.chaos-stabilizer.enemies-present = Сектор должен быть свободен от врагов
fun.chaos-stabilizer.online = [lime]Стабилизатор Хаоса оживает — хаос умолкает.[]
fun.chaos-stabilizer.offline = [orange]Стабилизатор Хаоса замолкает — хаос возвращается.[]
fun.chaos-stabilizer.overrun = [scarlet]Враги вернулись в сектор — Стабилизатор Хаоса не выдержал и взорвался.[]
block.sonka-fun-mode-chaos-stabilizer.name = Стабилизатор Хаоса
block.sonka-fun-mode-chaos-stabilizer.description = Пока полностью снабжён ресурсами, энергией и криожидкостью, полностью подавляет Хаос. Построить можно только в секторе без врагов — если враги туда вернутся, блок взорвётся вместо того, чтобы отключиться.
block.sonka-fun-mode-chaos-stabilizer.details = Не оружие и не щит — приговор. Пока он работает, мир просто перестаёт пытаться тебе навредить, пока ты его кормишь. Кто-то скажет, что это милость, о которой миру вообще не следовало просить.

fun.curse.language-switch.title = Языковая путаница
setting.fun-language-switch-enabled.name = Включить Языковую путаницу
setting.fun-language-switch-enabled.description = Раз в несколько минут весь интерфейс на пару секунд переключается на случайный язык (включая router), затем возвращается обратно. Работает везде.

fun.curse.drunk-camera.title = Пьяная камера
setting.fun-drunk-camera-enabled.name = Включить Пьяную камеру
setting.fun-drunk-camera-enabled.description = В случайные моменты камера перебирает: на несколько секунд изображение кренит и водит по кругу. Работает везде. (Настоящий поворот мира из мода в Mindustry невозможен - это ближайшая замена в виде пьяного покачивания.)


fun.curse.volatile-economy.title = Нестабильная экономика
setting.fun-volatile-economy-enabled.name = Включить Нестабильную экономику
setting.fun-volatile-economy-enabled.description = Стоимость постройки блоков каждые полминуты колеблется вверх и вниз - инфляция и распродажи, - но всегда вокруг НОРМЫ, так что цены не залипают наверху навсегда. Твоя промышленность рулит, где они осядут: работающие нефтевышки разгоняют инфляцию, компрессоры пластания её остужают. Цена одинакова для всех в лобби (и совпадает с тем, что реально списывается), так что каждый игрок видит скачки в своём меню постройки. В чат сообщается, когда рынок меняет режим. Работает в одиночке/хостом/по сети.
fun.economy.up = [scarlet]Скачок цен - стоимость постройки до {0}% от обычной.[]
fun.economy.down = [lime]Распродажа! Стоимость постройки до {0}% от обычной.[]

fun.curse.crooked-building.title = Кривая постройка
setting.fun-crooked-building-enabled.name = Включить Кривую постройку
setting.fun-crooked-building-enabled.description = Ваши постройки не стоят на месте. Время от времени уже стоящий на карте поворачиваемый блок сам разворачивается в случайную новую сторону — конвейер закручивается сам на себя, турель уходит любоваться пейзажем — а соседи перестраиваются вокруг. Только блоки вашей команды; хуже по мере роста хаоса. Работает в одиночке/хостом.

fun.curse.deserters.title = Дезертиры
setting.fun-deserters-enabled.name = Включить Дезертиров
setting.fun-deserters-enabled.description = Время от времени один из ваших юнитов бросает вашу команду и уходит в нейтралы, сохраняя своё имя (юнит, которым вы лично управляете, никогда не дезертирует). Вы узнаёте об этом из уведомления об увольнении. Если рядом стоят dagger, mace или fortress — боевой дух крепче, и шанс дезертирства ниже; пока в вашей команде жив reign, дезертирство прекращается полностью, а сам reign казнит любого дезертира поблизости; scepter может переманить дезертира обратно на службу. Работает в одиночке/хостом.
fun.deserters.message = [lightgray]{0} «{1}» дезертировал. Боевой дух - штука хрупкая.[]
fun.deserters.recruited = [lime]Скипетр переманивает {0} обратно на службу.[]


fun.curse.turret-reworks.title = Переделка турелей (Серпуло)
setting.fun-turret-reworks-enabled.name = Включить Переделку турелей
setting.fun-turret-reworks-enabled.description = У каждой турели Серпуло свой прикол: у scatter пропадает разброс, scorch поджигает себя, hail бьёт далеко но слабо, lancer наводится на землю но бьёт только воздух, arc и spectre перегреваются и разряжаются, ракеты swarmer щадят свою цель но бьют по соседним (против толп имба), salvo даёт очередь в 20 патронов и минуту перезаряжается, segment ломает снаряды своих, fuse меняет урон на отдачу, ripple бьёт близко но сильно, cyclone крутится и палит по кругу без остановки, meltdown жжёт вашу базу под лучом на тройном уроне. Изменения статов - со следующего запуска; поведение - сразу. Работает в одиночке/хостом.
fun.turret.heat = Перегрев

fun.curse.machine-quirks.title = Причуды машин (Серпуло)
setting.fun-machine-quirks-enabled.name = Включить Причуды машин
setting.fun-machine-quirks-enabled.description = Сборные приколы машин: импакт-реакторы неотключаемо трясут всю карту (чем больше работает, тем сильнее), RTG-генераторы облучают соседних юнитов (урон + дебаф), термальные генераторы сгорают без охлаждения, насосы иногда тонут, а солнечные панели в темноте работают В МИНУС, но рядом с работающими освещателями выдают сверхмощность. Работает в одиночке/хостом.
fun.machine.drowned = [lightgray]Насос утонул. Он знал, на что шёл.[]
fun.economy.normal = [gray]Рынок успокаивается - цены вернулись к норме ({0}%).[]

fun.curse.factory-reworks.title = Переделка заводов (Серпуло)
setting.fun-factory-reworks-enabled.name = Включить Переделку заводов
setting.fun-factory-reworks-enabled.description = У каждого завода Серпуло свой прикол: кремниевые печи/тигли играют в рулетку (вдвое или ничего), обжиг размораживает и подпаливает соседей, ткач фазы накладывает случайные эффекты на юнитов рядом, электропечь бьёт током всё вокруг, криосмеситель примораживает соседей (поставь рядом обжиг, чтобы разморозить), пиратитовый смеситель самовоспламеняется, взрыв-смеситель иногда детонирует, плавильня плавит соседние блоки, сепаратор/разборщик выдают скрап (разборщик редко выдаёт что-то ценное), споровый пресс замедляет юнитов рядом, пульверизатор оглушительно громкий, угольная центрифуга затемняет экран. А ещё: пластановые компрессоры сдерживают инфляцию (при включённой Нестабильной экономике). Работает в одиночке/хостом.

fun.curse.chaos.title = Хаос
setting.fun-chaos-enabled.name = Включить Хаос
setting.fun-chaos-enabled.description = Глобальный уровень хаоса (полоса над каждым построенным Алтарём жертвоприношения) со временем растёт и увеличивает частоту плохих/бесячих эффектов мода - загадочные сообщения, ветер, дезертиры, сонные буры, пьяная камера, смена языка, тонущие насосы. Снизить его можно только принеся в жертву именно того юнита, которого требует алтарь; цена юнита роли не играет, но чем он здоровее и чем длиннее серия правильных жертв, тем сильнее эффект. Усиливает другие проклятия, так что эффект зависит от того, какие из них включены.

fun.curse.backward-belts.title = Лунная походка конвейеров
setting.fun-backward-belts-enabled.name = Включить Лунную походку конвейеров
setting.fun-backward-belts-enabled.description = Лента каждого конвейера анимируется НАЗАД, а ресурсы едут вперёд как ни в чём не бывало. Транспорт не тронут - конвейеры просто газлайтят вас. Чисто визуально, переключается мгновенно, работает на любом сервере. Пластаниевые конвейеры вне игры - у их ленты нет анимации.

fun.curse.unit-reworks.title = Переделка юнитов (Серпуло)
setting.fun-unit-reworks-enabled.name = Включить Переделку юнитов
setting.fun-unit-reworks-enabled.description = Приколы по названиям юнитов, партия 1 (мехи): dagger быстр и жесток в упор, пламя mace отшвыривает и поджигает, fortress окапывается стоя на месте (overdrive + экранирование: урон x1.4, живучесть x3), scepter требует свиту - иначе грустит и не стреляет, reign может быть только один на команду (новый устраивает переворот), лечащая вспышка nova стала жгущей сверхновой, pulsar копит ЭМИ строго по таймеру, quasar - прожектор с длинным мощным, но медленным лазером, vela ходит под глобальным ветром (по ветру быстро, против - еле-еле), corvus кормится смертями рядом, каркает и пугается вражеской авиации. Партия 2: смерть рядом с atrax может обернуться расползающимся облаком чумы, которое цепляется по всей стае, укусы spiroct сгущают ядовитые облака, раненый arkyid хромает и спотыкается, зато муштрует пауков рядом (overclock), flare периодически пускает самонаводящиеся ракеты, поджигающие место попадания, horizon не умеет останавливаться, а его бомбы перелетают цель на пару клеток, zenith бьёт только прямо под собой (урон x3 + поджог), antumbra таскает за собой фантомные копии, способные съесть летящий снаряд, а пока жив хоть один eclipse - солнце меркнет: экран темнеет, солнечные панели теряют мощность. Партия 3 (вспомогательная авиация и флот: mono, poly, mega, quad, oct и морские слизни) и партия 4 (киты, а также базовые юниты alpha/beta/gamma) добавляют свои приколы - подробности смотрите в описании каждого юнита в дереве технологий. Изменения статов - со следующего запуска; поведение живое. Работает в одиночке/хосте.
fun.units.coup = [accent]Переворот! Новый {0} сверг старого. Да здравствует король.[]

fun.curse.safety-regs.title = Техника безопасности
setting.fun-safety-regs-enabled.name = Включить Технику безопасности
setting.fun-safety-regs-enabled.description = Десять исследований «Техника безопасности» открываются по одному по мере прохождения всё более сложных секторов (шестое пропечатано арабской «6» вместо «VI» — опечатка в сертификате, которую так и не исправили). Ни одно из них не факультативно: как только курс открылся, у тебя есть время до захвата следующего сектора, чтобы пройти его — не успеешь, и твои юниты решат, что подчиняться больше не обязательно, и начнут переходить на сторону врага. Только в одиночной игре/на хосте.
fun.safety.mutiny = [scarlet]{0} переходит на сторону врага — так и не прошёл обязательную Технику безопасности.[]
