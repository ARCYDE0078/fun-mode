fun.altar.hint.move.fly.1 = гудит где-то наверху
fun.altar.hint.move.fly.2 = отбрасывает движущуюся тень сверху
fun.altar.hint.move.naval.0 = рассекает открытую воду
fun.altar.hint.move.naval.1 = оставляет след на волнах
fun.altar.hint.move.naval.2 = подчиняется только приливу
fun.altar.hint.move.hover.0 = скользит чуть над землёй
fun.altar.hint.move.hover.1 = никогда не касается земли
fun.altar.hint.move.hover.2 = парит на волосок от поверхности
fun.altar.hint.move.ground.0 = шагает на гусеницах или ногах
fun.altar.hint.move.ground.1 = твёрдо стоит на земле
fun.altar.hint.move.ground.2 = оставляет следы в пыли
fun.altar.hint.size.small.0 = настолько мало, что его легко не заметить
fun.altar.hint.size.small.1 = не крупнее ящика
fun.altar.hint.size.small.2 = легко теряется в толпе
fun.altar.hint.size.med.0 = примерно с человека ростом
fun.altar.hint.size.med.1 = крепкого рабочего сложения
fun.altar.hint.size.med.2 = ни мало, ни огромно
fun.altar.hint.size.large.0 = возвышается над всем вокруг
fun.altar.hint.size.large.1 = отбрасывает длинную тень
fun.altar.hint.size.large.2 = построено в устрашающем масштабе
fun.altar.hint.role.miner.0 = всё ещё помнит, как копать
fun.altar.hint.role.miner.1 = имеет мозоли от добычи руды
fun.altar.hint.role.miner.2 = хорошо ориентируется среди скал
fun.altar.hint.role.builder.0 = хорошо управляется с инструментами
fun.altar.hint.role.builder.1 = ловко в строительстве
fun.altar.hint.role.builder.2 = никогда не отходит далеко от стройки
fun.altar.hint.role.unarmed.0 = и мухи не обидит
fun.altar.hint.role.unarmed.1 = вообще не носит оружия
fun.altar.hint.role.unarmed.2 = не желает никому зла
fun.altar.hint.role.armed.0 = ощетинилось оружием
fun.altar.hint.role.armed.1 = не прочь подраться
