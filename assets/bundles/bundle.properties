fun.settings.category = Fun Mode

fun.warning.title = Fun Mode
fun.warning.text = This mod includes sudden, VERY loud sounds - turn your volume down if that's a concern.\n\nMany curses change vanilla blocks and units in ways that aren't obvious from their stats alone. Read a block's or unit's in-game description (its "database" info screen) for the full picture of what's actually going on.\n\nIMPORTANT: this version is NOT compatible with saves made before it. Start a brand new save - loading an old one is unsupported and can break in strange ways.
fun.warning.wait = Wait {0}s...

fun.chatlog.title = Fun Mode Messages
fun.chatlog.empty = Nothing yet.

fun.curse.mystery.title = Mysterious Messages
setting.fun-mystery-enabled.name = Enable Mysterious Messages
setting.fun-mystery-enabled.description = Every few minutes you're kindly informed that something new and exciting has happened. Sometimes it even has.

fun.mystery.1 = [accent]Something new and exciting just happened![]
fun.mystery.2 = [accent]Don't worry about it.[]
fun.mystery.3 = [accent]Everything is fine. Probably.[]
fun.mystery.4 = [accent]You might want to check on... no, never mind.[]
fun.mystery.5 = [accent]A small administrative adjustment has been performed.[]
fun.mystery.6 = [accent]The factory thanks you for your continued cooperation.[]
fun.mystery.7 = [accent]Did you hear that too?[]
fun.mystery.8 = [accent]Somewhere, something changed forever.[]

fun.curse.obituaries.title = Unit Obituaries
setting.fun-obituaries-enabled.name = Enable Unit Obituaries
setting.fun-obituaries-enabled.description = Every unit on your team has a name. You learn it from the obituary.

fun.obituaries.message = [lightgray]{0} "{1}" has fallen in the line of duty at ({2}, {3}). Press G to pay respects.[]
fun.obituaries.summary = [lightgray]...and {0} more brave souls we didn't have time to mourn.[]
fun.obituaries.names = Bob,Steve,Kevin,Dave,Greg,Carl,Vinny,Boris,Igor,Oleg,Pasha,Tolya,Zhora,Senya,Vitalik,Gennadiy,Petrovich,Semyonych,Arkasha,Lyosha

fun.curse.graphite-batch.title = Bulk Presses
setting.fun-graphite-batch-enabled.name = Enable Bulk Presses
setting.fun-graphite-batch-enabled.description = Graphite press and multi-press work in enormous batches: every input, output and craft time is x100. Same rate overall, but they hoard 100 coal then belch 100 graphite. Takes effect on next game launch.

fun.curse.duo-placebo.title = Duo Placebo Rounds
setting.fun-duo-placebo-enabled.name = Enable Duo Placebo Rounds
setting.fun-duo-placebo-enabled.description = The duo fires a huge, glowing, explosive-looking projectile. It deals 5 damage. Takes effect on next game launch.

fun.curse.mace-dragon.title = Mace Dragon Breath
setting.fun-mace-dragon-enabled.name = Enable Mace Dragon Breath
setting.fun-mace-dragon-enabled.description = The mace's flamethrower reaches 20 tiles. The flame doesn't look any longer - the damage just arrives from over there. Takes effect on next game launch.

fun.curse.jumpscare.title = The Wind
setting.fun-jumpscare-enabled.name = Enable The Wind
setting.fun-jumpscare-enabled.description = At a random moment, a VERY loud gust of wind. That's it.

fun.curse.explosive-production.title = Explosive Production
setting.fun-explosive-production-enabled.name = Enable Explosive Production
setting.fun-explosive-production-enabled.description = Freshly produced units sometimes explode at the factory door: 20% for T1, 12%/10% for T2/T3, 6% for T4, 3% for T5. Works in singleplayer/hosting.

fun.explosive-production.message = [scarlet]{0} did not survive quality control.[]

fun.obituaries.respects = [accent]{0} has been honored. Thank you for your service.[]
keybind.fun-pay-respects.name = Pay respects
category.fun-mode.name = Fun Mode

fun.curse.no-north.title = No Northward Conveyors
setting.fun-no-north-enabled.name = Enable No Northward Conveyors
setting.fun-no-north-enabled.description = Conveyors don't go north here. Nobody knows why. Building one facing up ends predictably. Works in singleplayer/hosting.
fun.no-north.message = [scarlet]Conveyors don't go north here. Nobody knows why.[]

fun.curse.sleepy-drills.title = Sleepy Drills
setting.fun-sleepy-drills-enabled.name = Enable Sleepy Drills
setting.fun-sleepy-drills-enabled.description = Drills are only human: occasionally one dozes off and stops working until it's woken - click it, or just send any unit past it (units are alarm clocks). Works in singleplayer/hosting.

fun.curse.sneeze.title = Allergies
setting.fun-sneeze-enabled.name = Enable Allergies
setting.fun-sneeze-enabled.description = Your unit sneezes every couple of minutes and lurches a couple of tiles in a random direction. Works everywhere - it's your own unit.
fun.sneeze.toast = Achoo!

fun.curse.challenges.title = Administration Challenges
setting.fun-challenges-enabled.name = Enable Administration Challenges
setting.fun-challenges-enabled.description = Every few minutes the factory administration issues a 60-second challenge: don't build, don't lose units, deconstruct a wall, make a unit, kill enemies, or stockpile an item. Rewards for success, confiscation and an inspection party for failure. Works in singleplayer/hosting.
fun.challenge.start.nobuild = [accent]CHALLENGE: don't build anything yourself for 60 seconds. Hands off the mouse.[]
fun.challenge.start.nolosses = [accent]CHALLENGE: don't lose a single unit for 60 seconds. Keep them alive.[]
fun.challenge.start.breakwall = [accent]CHALLENGE: deconstruct one wall within 60 seconds. Any wall. Don't ask.[]
fun.challenge.start.makeunit = [accent]CHALLENGE: produce one unit within 60 seconds. Any unit will do.[]
fun.challenge.start.killenemies = [accent]CHALLENGE: destroy {0} enemy units within 60 seconds.[]
fun.challenge.start.hoard = [accent]CHALLENGE: stockpile {0} in your core within 60 seconds.[]
fun.challenge.win = [lime]Challenge complete! The administration is pleased: +{0} {1} delivered to the core.[]
fun.challenge.lose = [scarlet]Challenge failed. The administration is FURIOUS: {0} {1} and {2} {3} confiscated. An inspection has been dispatched to your core.[]
fun.challenge.name.nobuild = Don't Build
fun.challenge.name.nolosses = No Losses
fun.challenge.name.breakwall = Break a Wall
fun.challenge.name.makeunit = Make a Unit
fun.challenge.name.killenemies = Kill Enemies
fun.challenge.name.hoard = Hoard Resources

setting.fun-debug-menu.name = Debug menu (temporary)

fun.curse.big-routers.title = BIG Routers
setting.fun-big-routers-enabled.name = Enable BIG Routers
setting.fun-big-routers-enabled.description = New routers: 3x3, 5x5, 7x7, 9x9 and 11x11. It's the router texture, but bigger. As the community intended. Takes effect on next game launch.
block.sonka-fun-mode-router3.name = Router 3x3
block.sonka-fun-mode-router5.name = Router 5x5
block.sonka-fun-mode-router7.name = Router 7x7
block.sonka-fun-mode-router9.name = Router 9x9
block.sonka-fun-mode-router11.name = Router 11x11
block.sonka-fun-mode-router3.description = It's a router.
block.sonka-fun-mode-router5.description = It's a bigger router.
block.sonka-fun-mode-router7.description = It's an even bigger router.
block.sonka-fun-mode-router9.description = The router grows.
block.sonka-fun-mode-router11.description = The router is inevitable.
block.sonka-fun-mode-router11.details = The router is inevitable. Everything else in this world may betray you - the drills doze off, the buildings spin on their own, the sky spits acid - but the router routes. Cling to it.

fun.curse.mega-illuminator.title = Mega Illuminator
setting.fun-mega-illuminator-enabled.name = Enable Mega Illuminator
setting.fun-mega-illuminator-enabled.description = A 3x3 illuminator that lights THE ENTIRE MAP, glows blindingly even in daylight, and whites out your whole screen up close. Takes effect on next game launch.
block.sonka-fun-mode-mega-illuminator.name = Mega Illuminator
block.sonka-fun-mode-mega-illuminator.description = VERY, VERY bright. Do not look directly at the illuminator.
block.sonka-fun-mode-mega-illuminator.details = Somewhere in the design notes, "illuminate the area" was underlined three times; nobody asked how much. They say if you stare into it long enough you can see every curse coming - right before you can't see anything at all.

fun.curse.survival-sandbox.title = Sandbox Privileges
setting.fun-survival-sandbox-enabled.name = Enable Sandbox Privileges
setting.fun-survival-sandbox-enabled.description = The item, liquid and power VOIDS are buildable in survival. Free. At 1 health, so no wall tricks. Takes effect on next game launch.

fun.curse.blast-generators.title = Blast Compound Energy
setting.fun-blast-generators-enabled.name = Enable Blast Compound Energy
setting.fun-blast-generators-enabled.description = Combustion and steam generators now also run JUST FINE on blast compound - the exploding was a design oversight and has been removed. Coal still works and is a solid EARLY power source (~480 and ~1320 power/s), down from the old absurd 2700. The catch: coal now very slowly WEARS THEM DOWN (minutes to break one), so lean on coal at the start but move to cleaner fuel later. Takes effect on next launch; coal wear is live.

fun.curse.cold-reactor.title = The Gauge Lies
setting.fun-cold-reactor-enabled.name = Enable The Gauge Lies
setting.fun-cold-reactor-enabled.description = The thorium reactor's heat gauge lies: a safe reactor glows scorching orange, one about to detonate looks perfectly calm. Mechanics untouched - only your eyes are affected. Takes effect on next game launch.


fun.curse.spider-genes.title = Cursed Spider Genetics
setting.fun-spider-genes-enabled.name = Enable Cursed Spider Genetics
setting.fun-spider-genes-enabled.description = The spiders swap lifestyles: the toxopid loses all weapons and becomes the world's largest crawler - charges and detonates like a thorium reactor on attack or death (hits everyone, its own team included). The crawler stops exploding entirely and instead fires a watered-down copy of the toxopid's web cannon like a regular shooter. Explosion needs singleplayer/hosting; weapon swaps apply on next launch. The reactor blast now also leaves a lingering poison cloud over the crater.


fun.curse.slow-projector.title = Slow Projector
setting.fun-slow-projector-enabled.name = Enable Slow Projector
setting.fun-slow-projector-enabled.description = The overdrive projector's evil twins, in two sizes: the slow projector and the slow dome. They slow ALL buildings in radius - enemy and yours alike, sparing only themselves - and chill enemy units. WARNING: a slow field touching an overdrive projector or dome annihilates both. Takes effect on next game launch.
block.sonka-fun-mode-slow-projector.name = Slow Projector
block.sonka-fun-mode-slow-projector.description = Like the overdrive projector, but the opposite, and pointed at the enemy.
block.sonka-fun-mode-slow-projector.details = Time bends the wrong way here. Bring it near its overdriven twin and reality files a complaint - loudly, and with casualties. In a world this cursed, not even your own speed can be trusted.

fun.curse.foreshadow-nuke.title = The True Omen
setting.fun-foreshadow-nuke-enabled.name = Enable The True Omen
setting.fun-foreshadow-nuke-enabled.description = The foreshadow no longer fires at individual targets. Given power and ammo it charges for 5 minutes - watch the clock face fill clockwise above it - then discharges across HALF THE MAP, killing every unit in the radius, yours included. Starve it and the charge pauses. Only ONE foreshadow may exist on the map. Works in singleplayer/hosting.
fun.foreshadow.warning = [scarlet]The foreshadow is charging. You have ten seconds to make peace with your decisions.[]
fun.foreshadow.discharge = [scarlet]The omen has spoken.[]

fun.curse.diff-generator.title = Orange Consequences
setting.fun-diff-generator-enabled.name = Enable Orange Consequences
setting.fun-diff-generator-enabled.description = The differential generator gets the thorium reactor treatment: detonates at reactor scale when destroyed while running (orange smoke, per the spec), and a fueled generator with no cryofluid heats toward detonation on its own - watch for the red glow. Explosion fields apply on next launch; the heat drive works in singleplayer/hosting.

block.sonka-fun-mode-slow-dome.name = Slow Dome
block.sonka-fun-mode-slow-dome.description = Like the overdrive dome, but the opposite. Annihilates on contact with overdrive fields, so plan your urban layout with care.
block.sonka-fun-mode-slow-dome.details = The bigger the field, the bigger the argument when it meets an overdrive. Urban planning, in a cursed world, is a blood sport.

fun.curse.router-language.title = Router Language
setting.fun-router-language-enabled.name = Enable Router Language
setting.fun-router-language-enabled.description = Router is a language, and every router speaks it: finish a router - the big ones included - and its icon is broadcast to the chat for all to admire. Routers build normally; they just announce themselves. Rate-limited so a wall of them doesn't flood the chat. Works in singleplayer/hosting.
fun.challenge.win.full = [lime]Challenge complete! ...but your core is completely full, so consider it a moral victory.[]

fun.curse.sacrifice-altar.title = Sacrifice Altar
setting.fun-sacrifice-altar-enabled.name = Enable Sacrifice Altar
setting.fun-sacrifice-altar-enabled.description = A 3x3 altar that demands a specific unit (shown floating above it). Feed it the unit it asks for and Chaos recedes; feed it the wrong one and Chaos rises. It accepts a sacrifice roughly once a minute at low Chaos, and more often (down to about half that) the higher Chaos climbs, then craves a different unit. Sacrifices refund half their build cost to your core. If you have no units to offer, it drinks resources straight from your core instead (keeping a buffer so it won't starve you). Researchable in the campaign; while your team has no altar at all, Chaos self-calms gently so you're not doomed before you can build one. Takes effect on next game launch.
block.sonka-fun-mode-sacrifice-altar.name = Sacrifice Altar
block.sonka-fun-mode-sacrifice-altar.description = Demands a specific unit, roughly once a minute (faster as Chaos climbs). The right offering calms the Chaos - healthier units and a streak of correct offerings calm it more; the wrong one enrages it. Consumed units refund half their build cost to your core.
block.sonka-fun-mode-sacrifice-altar.details = They say the world only turned cruel after the first altar was raised - or is the altar the one thing holding the cruelty back? Keep it fed. When the sky, the ground, and your own machines turn on you at once, this is where you come to beg.
fun.altar.demand = The altar demands a sacrifice: {0}.
fun.altar.demand.golden = [gold]The altar craves a GOLDEN sacrifice: {0}![]
fun.altar.accept = [lime]The altar accepts your {0}. Chaos recedes.[]
fun.altar.combo = [lime]The altar accepts your {0}. Chaos recedes. (combo x{1})[]
fun.altar.golden = [gold]The altar DEVOURS your {0}! Chaos plummets.[]
fun.altar.reject = [scarlet]The altar wanted {0}, got {1}. Chaos rises.[]
fun.altar.demand.item = The altar, denied flesh, demands {1}x {0}.
fun.altar.accept.item = [lime]The altar drinks {1}x {0}. Chaos recedes.[]
fun.altar.hint = something that {0}, is {1}, and {2}
fun.altar.hint.move.fly.0 = takes to the sky
fun.altar.hint.move.fly.1 = hums somewhere overhead
fun.altar.hint.move.fly.2 = casts a moving shadow from above
fun.altar.hint.move.naval.0 = cuts through open water
fun.altar.hint.move.naval.1 = leaves a wake on the waves
fun.altar.hint.move.naval.2 = answers only to the tide
fun.altar.hint.move.hover.0 = glides just above the ground
fun.altar.hint.move.hover.1 = never quite touches the dirt
fun.altar.hint.move.hover.2 = drifts a hair off the surface
fun.altar.hint.move.ground.0 = marches on treads or legs
fun.altar.hint.move.ground.1 = keeps its feet on solid ground
fun.altar.hint.move.ground.2 = leaves tracks in the dirt
fun.altar.hint.size.small.0 = small enough to overlook
fun.altar.hint.size.small.1 = no bigger than a crate
fun.altar.hint.size.small.2 = easy to miss in a crowd
fun.altar.hint.size.med.0 = about man-height
fun.altar.hint.size.med.1 = a solid, workaday build
fun.altar.hint.size.med.2 = neither small nor towering
fun.altar.hint.size.large.0 = looming over everything nearby
fun.altar.hint.size.large.1 = cloaked in a long shadow
fun.altar.hint.size.large.2 = built on an intimidating scale
fun.altar.hint.role.miner.0 = still remembers how to dig
fun.altar.hint.role.miner.1 = has calluses from mining
fun.altar.hint.role.miner.2 = knows its way around a rock face
fun.altar.hint.role.builder.0 = good with tools
fun.altar.hint.role.builder.1 = handy at construction
fun.altar.hint.role.builder.2 = never far from a half-finished build
fun.altar.hint.role.unarmed.0 = wouldn't hurt a fly
fun.altar.hint.role.unarmed.1 = carries no weapon at all
fun.altar.hint.role.unarmed.2 = means nobody any harm
fun.altar.hint.role.armed.0 = bristles with weaponry
fun.altar.hint.role.armed.1 = isn't shy about a fight
fun.altar.hint.role.armed.2 = came ready for trouble
fun.curse.party-roulette.title = Party Roulette
setting.fun-party-roulette-enabled.name = Enable Party Roulette
setting.fun-party-roulette-enabled.description = Every so often a roulette wheel spins and lands on ONE player in the game, hitting their unit with a short effect everyone can see - jammed weapons, frozen stiff, sneezed across the map, a dizzy spell, or (rarely) a lucky speed surge - and calls their name out in chat. Shines in co-op; in singleplayer it keeps picking you. Spins more often the higher Chaos climbs. Host/SP only.
fun.roulette.fling = [accent]🎲 The wheel lands on {0}[accent] - a violent sneeze sends them flying![]
fun.roulette.jam = [accent]🎲 The wheel lands on {0}[accent] - weapons JAMMED![]
fun.roulette.freeze = [accent]🎲 The wheel lands on {0}[accent] - frozen stiff![]
fun.roulette.dizzy = [accent]🎲 The wheel lands on {0}[accent] - a dizzy spell![]
fun.roulette.lucky = [lime]🎲 The wheel lands on {0}[lime] - LUCKY! A surge of speed![]
fun.curse.cursed-weather.title = Cursed Weather
setting.fun-cursed-weather-enabled.name = Enable Cursed Weather
setting.fun-cursed-weather-enabled.description = The sky turns hostile. The map's OWN vanilla weather can worsen into a nastier custom form: RAIN into a DOWNPOUR (power nodes short) then a THUNDERSTORM (lightning); SNOW into a BLIZZARD (everything freezes without a nearby heat source - a building holding slag or a flammable fuel); the (otherwise harmless) SANDSTORM into a SAND STORM (units bog down and can barely see); and SPORES into a SPORE STORM (exhaustion + spore-slow). On top of that, random DISASTERS strike on their own: ACID RAIN corrodes anything not under a force projector (likelier the more factories you run), an ELECTRIC STORM hammers the field with relentless lightning, a SOLAR FLARE burns units not under a projector, and a HEAT WAVE overheats units into flames. Acid rain and heat never strike snow sectors. Each phenomenon has a signature campaign sector whose briefing warns of it. One disaster at a time. Host/SP only.

fun.curse.crash-pads.title = Crashing Launch Pads
setting.fun-crash-pads-enabled.name = Enable Crashing Launch Pads
setting.fun-crash-pads-enabled.description = Every so often a malfunctioning ENEMY launch pad drops out of the sky and crashes onto your sector, cargo and all. A shadow gathers, the pad screams down, and the impact depends on what it was hauling: BLAST COMPOUND goes off like a bomb, PYRATITE or COAL scatters fire, SURGE ALLOY discharges in a burst of lightning, and inert freight just slams down in a cloud of dust. A random share of the surviving cargo is salvaged straight into your core (free resources) - but the drop can land on your base, and volatile freight (blast compound, pyratite) is destroyed by its own blast or fire, so there's nothing left to collect. Host/SP only.
fun.crashpad.incoming = [orange]A malfunctioning enemy launch pad is dropping onto your sector - take cover![]
fun.crashpad.loot = [lime]Salvaged from the wreck: +{0} {1}.[]
fun.crashpad.lost = [lightgray]The wreck's {0} is lost - your core is full.[]
fun.crashpad.burned = [lightgray]The volatile cargo went up on impact - nothing left to salvage.[]
fun.lore.crashpad.sector = An extraction outpost - all launch traffic and freight. Out here the sky drops surprises: malfunctioning enemy LAUNCH PADS sometimes crash onto the sector, cargo and all. Whatever their hold survives the impact is yours to salvage - but volatile freight (blast compound, pyratite, surge alloy) goes off where it lands. Keep an eye on the sky.

fun.curse.enemy-loot.title = Enemy Salvage
setting.fun-enemy-loot-enabled.name = Enable Enemy Salvage
setting.fun-enemy-loot-enabled.description = Every enemy unit that dies leaves SALVAGE - a random slice of the materials it was built from, recovered straight into your core. Bigger, costlier units pay out more; in the campaign you only ever recover resources you've already researched. A little battlefield economy: defense that quietly funds your factory. In the campaign the whole feature must be unlocked first - research the "Salvage Protocol" technology (under the separator in the tech tree). Host/SP only.
block.sonka-fun-mode-salvage-protocol.name = Salvage Protocol
block.sonka-fun-mode-salvage-protocol.description = Reprocessing rigs and scavenger drones that strip fallen enemy units for parts. Research it to unlock ENEMY SALVAGE: every enemy that dies drops a random share of the materials it was built from, straight into your core. A Fun Mode technology - not a building, and only needed in the campaign.
block.sonka-fun-mode-fun-tech-hub.name = Fun Mode Technologies
block.sonka-fun-mode-fun-tech-hub.description = The mod's own line of cursed sciences. Research it to open the Fun Mode branch: countermeasures that tame the chaos, and tools that turn it to your advantage. Not a building.
block.sonka-fun-mode-wreck-recovery.name = Wreck Recovery
block.sonka-fun-mode-wreck-recovery.description = Salvage beacons and recovery crews for downed craft. Research it to make malfunctioning enemy LAUNCH PADS start crashing onto your sector - cargo, hazards and all. A Fun Mode technology - not a building.
block.sonka-fun-mode-morale-doctrine.name = Morale Doctrine
block.sonka-fun-mode-morale-doctrine.description = Drills, a chain of command and a stiff upper lip. Research it to sharply cut how often your units DESERT. A Fun Mode technology - not a building.
block.sonka-fun-mode-chaos-dampener.name = Chaos Dampener
block.sonka-fun-mode-chaos-dampener.description = Stabilising fields that push back on the creeping madness. Research it to slow how fast the CHAOS bar climbs. A Fun Mode technology - not a building.
block.sonka-fun-mode-drill-alarms.name = Drill Alarm System
block.sonka-fun-mode-drill-alarms.description = Klaxons and shift supervisors for your mining rigs. Research it so drills nod off far less often. A Fun Mode technology - not a building.
block.sonka-fun-mode-gyro-stabilizers.name = Gyroscopic Stabilizers
block.sonka-fun-mode-gyro-stabilizers.description = Inertial mounts that keep buildings pointed where you put them. Research it so your structures spin around on their own far less. A Fun Mode technology - not a building.
block.sonka-fun-mode-weatherproofing.name = Weatherproofing
block.sonka-fun-mode-weatherproofing.description = Hardened casings and storm shutters. Research it to soften the damage from acid rain, solar flares, and lightning strikes. Doesn't touch blizzards, sandstorms, spore storms or heat waves - those work the same either way. A Fun Mode technology - not a building.
block.sonka-fun-mode-safety-1.name = Safety Training I
block.sonka-fun-mode-safety-1.description = The basics: how to stand near a wall without touching it, and which end of a thruster gets hot. Purely ceremonial, but it looks good on the wall next to the coffee machine.
block.sonka-fun-mode-safety-2.name = Safety Training II
block.sonka-fun-mode-safety-2.description = Covers falling debris, arc flash, and the correct way to scream when both happen at once.
block.sonka-fun-mode-safety-3.name = Safety Training III
block.sonka-fun-mode-safety-3.description = A whole unit on flammable dust, delivered by someone who very clearly used to work a graphite press.
block.sonka-fun-mode-safety-4.name = Safety Training IV
block.sonka-fun-mode-safety-4.description = Water safety for pump operators. Doesn't stop a pump from drowning - nothing does - but at least someone signed a form about it.
block.sonka-fun-mode-safety-5.name = Safety Training V
block.sonka-fun-mode-safety-5.description = Radiation, thermal runaway, and "why the RTG generator glows like that." Attendance is mandatory for anyone standing within blast radius, which in this mod is everyone.
block.sonka-fun-mode-safety-6.name = Safety Training 6
block.sonka-fun-mode-safety-6.description = The numbering skips "VI" because whoever printed the certificates ran out of Roman numerals halfway through and nobody ever fixed it. Like every course in this program, it's mandatory the moment it's unlocked: sit on it past the next sector and your own units decide the chain of command isn't worth respecting anymore, and start defecting to the enemy outright.
block.sonka-fun-mode-safety-7.name = Safety Training VII
block.sonka-fun-mode-safety-7.description = Advanced firearm safety, for turrets that occasionally forget which way is "forward."
block.sonka-fun-mode-safety-8.name = Safety Training VIII
block.sonka-fun-mode-safety-8.description = Explosive-materials handling, presented entirely in the past tense by the surviving instructor.
block.sonka-fun-mode-safety-9.name = Safety Training IX
block.sonka-fun-mode-safety-9.description = A refresher course. Everyone insists they don't need a refresher. Everyone needs the refresher.
block.sonka-fun-mode-safety-10.name = Safety Training X
block.sonka-fun-mode-safety-10.description = The final certificate. It changes nothing, functionally, but the graduation ceremony is very nice and nobody has died at one yet.
fun.weather.acid.start = [lime]Acid rain! Corrosion eats anything not under a force projector.[]
fun.weather.acid.end = [lightgray]The acid rain lets up.[]
fun.weather.downpour = [cyan]The rain thickens into a DOWNPOUR - power nodes start shorting out![]
fun.weather.storm = [yellow]A THUNDERSTORM breaks - lightning lashes the field![]
fun.weather.rain.end = [lightgray]The storm passes.[]
fun.weather.blizzard.start = [cyan]The snowfall whips up into a BLIZZARD - everything freezes without a heat source nearby.[]
fun.weather.blizzard.end = [lightgray]The blizzard blows over.[]
fun.weather.electric.start = [violet]An electric storm rolls in - lightning hammers the field without pause![]
fun.weather.electric.end = [lightgray]The electric storm passes.[]
fun.weather.sandstorm.start = [orange]The sandstorm thickens into a SAND STORM - units bog down and can barely see.[]
fun.weather.sandstorm.end = [lightgray]The sandstorm settles.[]
fun.weather.solar.start = [gold]A solar flare erupts - radiation burns anything not under a force projector.[]
fun.weather.solar.end = [lightgray]The solar flare fades.[]
fun.weather.heat.start = [orange]A scorching heat wave settles in - units overheat and catch fire in the open.[]
fun.weather.heat.end = [lightgray]The heat wave breaks.[]
fun.weather.spore = [purple]The spores thicken into a SPORE STORM - exhaustion and spore-slow choke the field![]
fun.weather.spore.end = [lightgray]The spore storm thins out.[]

# --- Cursed campaign lore: block database "details" (shown once researched) ---
fun.lore.thorium-reactor = Trust the gauge, they told the last crew. It glows hottest when it's stone cold, and sits calm when it's a breath from taking the district with it. The last crew is why we tell you this.
fun.lore.impact-reactor = It does not hum. It growls, and the ground growls back - harder the closer you dare to stand. Foundations crack. Nerves crack first.
fun.lore.rtg-generator = Silent, tireless, and quietly cooking anything alive that lingers too long beside it. Power has a price; here it's paid in roentgens.
fun.lore.thermal-generator = "Set it on a vent and walk away," said the manual. It never mentioned what happens when the coolant walks away too. It runs hot, then hotter, then not at all.
fun.lore.pump-drown = Nobody ever taught these things to swim. Every so often the water simply wins, and a pump goes under for good - deep water settles the argument faster than shallow does.
fun.lore.plastanium-smoke = Compress plastanium long enough and the process forgets to be clean about it. A billowing black cloud rolls off every running unit, and stand close enough to breathe it and the whole world dims with it.
fun.lore.combustion-generator = Feed it the fuel that should kill it and it purrs. Feed it the honest coal it was built for and it sulks, sparks, and quits. Nothing here works the way the label says.
fun.lore.steam-generator = It drinks explosive slurry and asks for seconds. Offer it plain coal and it takes offence, loudly. The world's fuels have swapped their manners.
fun.lore.graphite-press = Patience of a monk, appetite of a dragon. It swallows a hundred coal in perfect silence, then coughs out a hundred graphite all at once. Same total. Very different nerves.
fun.lore.differential-generator = Keep the cryofluid flowing. Let it run dry and it doesn't just stop - it heats, it glows, and it settles the matter itself, in orange. Somewhere a reactor is taking notes.
fun.lore.duo = All the sound and fury of a siege gun wrapped around the punch of a thrown pebble. The enemy flinches. That, in full, is the plan.
fun.lore.foreshadow = It no longer aims. It waits. Give it power and shells and it counts down across five long minutes - then half the world, friend and foe alike, simply isn't. An omen makes no exceptions.
fun.lore.factory-safety = Quality control here has been described, generously, as "aspirational". Every so often a fresh unit meets the world and immediately leaves it, right at the door. Stand clear on delivery.
fun.lore.conveyor = Watch it long enough and you'll swear the cargo rides against the grain. It doesn't. Your own eyes are simply one more thing you can no longer trust here.
fun.lore.no-north = One direction is simply forbidden here. A belt that dares face due north doesn't jam or stall - it goes off the map entirely, cargo and all. Nobody who built this way ever wrote down why.

# --- Cursed campaign lore: reworked crafters (database details) ---
fun.lore.factory.silicon = The silicon smelter and crucible have started gambling with every batch: sometimes a furnace strains and scorches itself, sometimes it just quietly doubles the smelt. No warning which throw you're getting.
fun.lore.factory.surge-smelter = Every so often the alloy inside doesn't finish smelting so much as discharge - a crack of lightning off the vat, and the smelter itself doesn't walk away unscathed either.
fun.lore.factory.phase-weaver = The fabric doesn't always finish weaving quietly. Sometimes reality hiccups around the loom and everything standing nearby gets shoved bodily away from it.
fun.lore.factory.pyratite-mixer = Mixing incendiary powder was never truly safe, and this one admits it: every so often a batch catches early and the mixer eats its own fire. Water or cold nearby keeps it in line.
fun.lore.factory.blast-mixer = Occasionally the mixer decides the compound is done cooking a little too early. It does not survive finding out, and neither does anything standing next to it.
fun.lore.factory.cryofluid-mixer = It no longer just holds the coolant - it leaks the cold into everything around it, chilling neighboring machinery to a crawl. Bring something that runs hot and the chill gives up.
fun.lore.factory.melter = The heat doesn't stay inside the crucible anymore. Standing machinery nearby quietly cooks under the residual warmth - unless something cold enough is close by to smother it.
fun.lore.factory.spore-press = The haze it presses out doesn't just smell bad. Anything organic that lingers in the cloud finds its legs going soft and slow.
fun.lore.factory.pulverizer = It has one volume: deafening. Every so often, apropos of nothing, it lets out a bang that carries across the whole base.
fun.lore.factory.coal-centrifuge = It spins coal dust into a standing black cloud that thickens the longer it runs, and the closer you stand, the less of your own base you can actually see.
fun.lore.factory.separator = It has started keeping a cut for itself - every so often a stray scrap of scrap slips into its own hopper before the rest moves on.
fun.lore.factory.disassembler = Taking things apart occasionally goes a little too well: once in a while it turns up a scrap of scrap, and rarer still, a sliver of plastanium or phase fabric it was never fed.
fun.lore.factory.kiln = It doesn't just fire the brick anymore - the heat spills out and speeds up whatever's standing next to it, singeing it a little in the process. Douse the fire and it's just warm.

# --- Cursed campaign lore: everything else we changed (database details) ---
fun.lore.router-language = Every router on this line has picked up a vocabulary of exactly one word, and it insists on announcing itself the moment it's finished - a proud little icon broadcast to everyone, whether they asked or not.
fun.lore.big-router = Somebody scaled up the vanilla router without asking why. It works exactly like the original in every way that matters - it is, after all, still just a router - only now it takes up rather more room to prove it.
fun.lore.chaos-stabilizer = Not a panic button - a monument. It won't even let you break ground until every last enemy has left the sector, and once it's fed and humming, it doesn't calm chaos so much as refuse to acknowledge it exists. Let its supply lapse, or let the enemy back onto the sector, and it makes its objection known immediately.
fun.lore.landing-pad = Somewhere out there, an enemy version of this pad is malfunctioning on schedule. Sooner or later a busted one gives up mid-flight and comes down on your sector instead of theirs - a gift, provided its cargo isn't the kind that goes off on landing.
fun.lore.chaos-dampener = Bending phase fabric takes a certain tolerance for realities that don't quite line up - which, it turns out, is exactly what it takes to keep the world's rising chaos from climbing as fast. Research the trick and the climb slows; it never stops on its own.
fun.lore.gyro-stabilizers = Precision-milled here to a tolerance that has nothing to do with plastanium and everything to do with buildings that won't stop turning to face new directions on their own. Researching it doesn't cure the fidgeting - it just holds facings a great deal steadier.
fun.lore.salvage-protocol = Once this trick is learned, nothing dies for free anymore. Every enemy that falls sheds a cut of whatever it was built from, salvaged straight back into your stores - assuming you've already worked out how to use the material yourself.
fun.lore.morale-doctrine = Doctrine doesn't stop a soldier from walking off the line - nothing does, forever - but it gives them a great deal more reason to stay. A dagger or two nearby helps too, and it never hurts to have a king watching.
fun.lore.drill-alarms = Rig one of these with a proper alarm and it stops nodding off mid-shift nearly as often. It still isn't a guarantee - nothing short of a passing unit ever fully wakes a drill that's made up its mind to nap.
fun.lore.void = Free to build now, wherever you like - it's only fair, since all it does is make things disappear. One good shove and it's the one disappearing; nobody engineered these to last.
fun.lore.mega-illuminator = Somebody took "more light" as a personal challenge and lost all sense of proportion. Powered, it doesn't light a room so much as erase your ability to see anything at all near it - visibility returns the moment you put some distance, or the light, between you and it.
fun.lore.slow-field = The overdrive projector's unloved sibling, built to do the opposite job on purpose. Everything nearby - yours included, it isn't picky - drags to a crawl inside the field. Let one touch an actual overdrive field and both machines settle the disagreement permanently.

# --- Cursed campaign lore: sector briefings (weather each biome is prone to) ---
fun.lore.sector.frozen-forest = Snow country. When the wind picks up, the snowfall thickens and whips sideways into a BLIZZARD: every unit caught in the open FREEZES and every building seizes up - unless a building nearby throws off heat. Anything working COAL or a flammable fuel - a combustion generator, a coal-fed press - keeps what's around it thawed.
fun.lore.sector.salt-flats = Open desert, nowhere to hide from the sky. The sandstorms here can thicken into a blinding SAND STORM: units bog down to a crawl and visibility drops to almost nothing across the whole field.
fun.lore.sector.overgrowth = Spore country. The spores in the air can thicken into a SPORE STORM that lays EXHAUSTION and SPORE-SLOW on every unit caught in the open, draining them and dragging them to a crawl.
fun.lore.sector.ruinous-shores = A storm-battered coast. The rain here can swell into a DOWNPOUR - far heavier, and heavy enough that your POWER NODES surge and burn out one by one. Keep spare links.
fun.lore.sector.windswept-islands = An archipelago of endless rain. Out here the rain builds all the way into a THUNDERSTORM: telegraphed bolts of LIGHTNING drop from the sky onto your units and buildings. Watch for the charge before the strike.
fun.lore.sector.tar-fields = Something in this air turns rain to poison. ACID RAIN falls green and corrosive, eating every unit and building not sheltered under a FORCE PROJECTOR - and the more factories you run, the likelier it comes.
fun.lore.sector.stained-mountains = The exposed ridges draw the sky's wrath. An ELECTRIC STORM can settle in - no rain, just a relentless, ceaseless barrage of LIGHTNING hammering the whole field.
fun.lore.sector.nuclear-complex = The complex knows radiation - but this kind comes from the sky. A SOLAR FLARE can erupt overhead: blinding pulses that BURN every unit not tucked under a FORCE PROJECTOR. Only a shield keeps flesh and metal whole.
fun.lore.sector.desolate-rift = A scorched, desolate waste. A HEAT WAVE can settle over it - the air itself cooks, and units left standing in the open slowly OVERHEAT and catch fire.

# --- Cursed campaign lore: reworked turrets (database details) ---
fun.lore.turret.scatter = It has stopped missing. Nobody taught it to; one day it simply refused to. The crews find that more unsettling than reassuring.
fun.lore.turret.scorch = It runs so hot it sets itself alight - and hits twice as hard for the privilege. Keep water close, or just let it burn for the damage.
fun.lore.turret.hail = Lobs its shells clean over the horizon now. What comes down is more rumor than round - but it comes down, eventually, everywhere.
fun.lore.turret.ripple = Traded its reach for weight. Nothing at distance need fear it, but anything up close gets flattened by shells that land like falling anvils.
fun.lore.turret.fuse = Fires a wall of shot that hits like a shove from a god - enemies don't so much die as get thrown clean off the map.
fun.lore.turret.salvo = Empties twenty fat rounds in a heartbeat, then stands there reloading for a full minute, whistling. Feast, then a long famine.
fun.lore.turret.swarmer = Its missiles have developed a fear of commitment. They flee whatever they lock onto and only detonate when something big corners them; small quick things they ignore outright.
fun.lore.turret.lancer = Reforged into a railgun. It winds up slowly and swings like a barn door, but when it fires, everything standing in the line goes through at once.
fun.lore.turret.wave = Its spray barely stings - until the soaked enemy starts to conduct, and the turret arcs lightning down the wet. Each pulse shoves the drenched back, too.
fun.lore.turret.tsunami = Every few seconds it stops aiming and simply hurls the sea - a wide, crashing wall of water that drenches everything in the arc.
fun.lore.turret.cyclone = Fires happily until it's glowing, then vents in one violent gust - a storm of its own flak and a shove that clears the field - and sulks, cold, until it can charge again.
fun.lore.turret.meltdown = Its beam no longer merely burns - it melts a channel straight down the firing line, cooking anything and anyone caught along it. Triple the bite.
fun.lore.turret.spectre = Loves its work too much. The more it fires the hotter and faster it goes, its shots crackling lightning - right up until it cooks itself and cracks.
fun.lore.turret.arc = Chokes as it heats, firing slower and slower. Endure the sputtering and it pays off in one wide, furious discharge of lightning.
fun.lore.turret.segment = Quicker on the draw than it was - and just as likely to swat down one of your OWN shots as an incoming one. Half genius, half liability.
fun.lore.turret.parallax = No longer bothers shooting flyers. It simply refuses to let them close - a silent bubble that shoves anything airborne back out into the open.

# --- Cursed campaign lore: reworked units (database details) ---
fun.lore.unit.dagger = Quicker on its feet now, and vicious with it - land a hit at point-blank range and it deals several times the listed damage, decaying back to normal the farther out the bullet flies.
fun.lore.unit.mace = Its flame doesn't just burn anymore - it shoves. Anything caught in the stream gets thrown back and left alight.
fun.lore.unit.mace-dragon = Its flame has learned real range - a full 20 tiles of dragon's breath, and it looks every bit the part.
fun.lore.unit.fortress = Stand it still long enough and it digs in - golden sparks, triple the effective health, 40% more damage. Take one step and all of it lapses.
fun.lore.unit.scepter = Royalty starts a retinue - allies nearby ride an overclock in its presence. Leave it without a single subject, though, and it sulks, refusing to even fire.
fun.lore.unit.reign = There can be only one reign per team. Let a second rise and the elder abdicates on the spot, dead before the newest heir even settles in.
fun.lore.unit.nova = Its healing pulse doubles as a small supernova - the same glow that mends allies also blinds and saps any enemy caught in the flash.
fun.lore.unit.pulsar = Pulses on a strict clock. Watch the glow swell for a few seconds and you can time it exactly - then lightning and a jolt of static to everything nearby.
fun.lore.unit.quasar = The brightest thing on the battlefield, quite literally - a walking searchlight whose beam hits harder and reaches farther, at the cost of a much longer wait between shots.
fun.lore.unit.vela = Named for the sail, and it shows - a shifting global wind pushes every vela downwind, gliding with the breeze and crawling against it.
fun.lore.unit.corvus = A carrion bird through and through. Any death nearby feeds it a slice of health, it caws when the mood strikes, and an enemy flyer getting too close can spook it mid-shot.
fun.lore.unit.atrax = The world's deadliest spider, and it shows - anything that dies within its reach bursts into a lingering plague cloud, and anyone who dies inside THAT cloud bursts again. A whole pack can chain.
fun.lore.unit.spiroct = Its venom lands instantly, and roughly one hit in three condenses into a small toxic cloud right where it struck - corrosive to anyone caught inside, except its own kind.
fun.lore.unit.arkyid = The pack matriarch - nearby spiders of its team ride an overclock in its presence. Wound it badly enough, though, and it starts to limp, wobble off course, and can even stumble to a dead stop.
fun.lore.unit.flare = Every so often it fires a small homing rocket at whatever's closest, unit or building, and leaves the impact zone burning.
fun.lore.unit.horizon = It can't help but keep moving - a constant forward drift whenever it slows - and its bombs share the restlessness, always overshooting the mark by a couple of tiles.
fun.lore.unit.zenith = Strikes from directly overhead now - its missiles barely reach past its own nose, but land for triple damage and set the target ablaze.
fun.lore.unit.antumbra = Two translucent phantom copies orbit it in a slow ring, and a fraction of the shots meant for it get swallowed by one instead - tanky against gunfire, though beams pass clean through the ghosts.
fun.lore.unit.eclipse = On its own clock it unleashes a blinding corona that disarms and saps everything nearby, telegraphed by a swelling black-and-gold glow. And while even one is alive anywhere, the sun itself dims and every solar panel underperforms.
fun.lore.unit.mono = The loner - while it's the only mono on the map, it mines like sixteen at once, hasted besides. The moment a second shows up, both fall right back to stock speed.
fun.lore.unit.poly = A jack of all trades that finishes none - left to its own devices, it keeps getting handed a brand-new job before it ever finishes the last one.
fun.lore.unit.mega = A deluded medic - its "attacks" actually mend nearby enemies. To make up for it, it also radiates a constant healing aura over its own side's units.
fun.lore.unit.quad = Everything comes in fours now - each bombing run drops a tight burst of four instead of one, paid for with a much longer wait between runs.
fun.lore.unit.oct = Under sustained fire it belches a cloud of ink - saps and slows any enemy caught inside, and gums up their turrets besides.
fun.lore.unit.risso = Famous for a lifetime of scars, and it fights like it too - drop below half health and it fights harder, carrying a shield and a burst of speed for as long as it stays that hurt.
fun.lore.unit.minke = The smallest and most curious of the baleen whales - the moment an enemy wanders near, it can't resist darting in for a closer look.
fun.lore.unit.bryde = A lunge-feeder - enough enemies bunched up nearby and it can't resist: a burst of speed and damage with a water-spout blow, then a rest before it can do it again.
fun.lore.unit.sei = One of the fastest whales - land a kill close by and its blood gets up, a few seconds of a burst of speed and heavier hits (a gold-sparking overdrive).
fun.lore.unit.omura = Famous for its lopsided colouring, and it lives up to it - periodically flipping between a dark, armored, slow phase and a pale, fragile, fast one.
fun.lore.unit.retusa = A tiny bubble-snail predator - no more burrowing: every second or two it simply dashes at the nearest enemy in range, a sudden kick of speed toward its target.
fun.lore.unit.oxynoe = Steals chloroplasts, and once per life, its own tail - dropping to critical health triggers a self-amputation: a burst of speed and a moment of true invulnerability, paid for with a long spell of sluggishness afterward (no lasting harm, just a couple of very slow minutes).
fun.lore.unit.cyerce = Its cerata carry stinging cells that don't wait for a fight to end - anything that dies within its reach sheds a patch of them right there, a toxic-green cloud rising over the corpse.
fun.lore.unit.aegires = Small, garishly coloured, and none too pleasant to bite - anything that gets close enough to strike it gets poisoned right back.
fun.lore.unit.navanax = A slug-eater - wounded, it'll gnaw a smaller allied slug for a bite of its health (never past 40% of what the victim had) and heal for several times what it took. Its EMP cannon-mount also boosts allied build speed harder than stock.
fun.lore.unit.alpha = The weakest of the three, always dumped from the core in a crowd - it flickers briefly untouchable every so often, no trigger needed, like static running through a decaying particle.
fun.lore.unit.beta = Every "beta build" rolls its own permanent status effect the instant it spawns - a buff or a debuff, chosen once and carried for life, so no two betas turn out quite the stock unit.
fun.lore.unit.gamma = The strongest of the three, and it doesn't even need to aim - it passively ticks out a small damaging pulse to anything standing close enough.
fun.lore.unit.toxopid = It's given up its guns entirely for one enormous suicide charge - closes on its target and detonates like a thorium reactor, a blast that spares nobody nearby, not even its own side. The crater festers with poison gas afterward.
fun.lore.unit.crawler = Doesn't explode anymore - traded its suicide bomb for a much weaker copy of the toxopid's web cannon, and fights like an ordinary ground unit instead of a walking mine.
fun.chaos.storm = [orange]The chaos swells - brace yourself.[]
fun.chaos.overload = [scarlet]CHAOS OVERLOAD - something in your base gives way![]

fun.curse.chaos-stabilizer.title = Chaos Stabilizer
setting.fun-chaos-stabilizer-enabled.name = Enable Chaos Stabilizer
setting.fun-chaos-stabilizer-enabled.description = An expensive endgame block, buildable only once the sector is clear of enemy units. Fed a steady diet of resources, power, and cryofluid, it doesn't just calm Chaos like the altar does - it completely silences it, dropping the level to zero and stopping every chaos-driven effect outright. Let any one of its three inputs run dry and Chaos resumes climbing from where it left off. It's a victory monument, not a fortress: if enemy units ever set foot back on the sector, it can't take the strain and explodes violently (heavy area damage, block destroyed) instead of just switching off.
fun.chaos-stabilizer.enemies-present = Sector must be clear of enemies
fun.chaos-stabilizer.online = [lime]The Chaos Stabilizer hums to life - chaos is silenced.[]
fun.chaos-stabilizer.offline = [orange]The Chaos Stabilizer falls silent - chaos resumes.[]
fun.chaos-stabilizer.overrun = [scarlet]Enemies have returned to the sector - the Chaos Stabilizer couldn't hold and blew apart.[]
block.sonka-fun-mode-chaos-stabilizer.name = Chaos Stabilizer
block.sonka-fun-mode-chaos-stabilizer.description = While fully fed resources, power, and cryofluid, completely eradicates Chaos. Only buildable in a sector clear of enemies - if enemies return to that sector, it explodes instead of shutting down.
block.sonka-fun-mode-chaos-stabilizer.details = Not a weapon, not a shield - a verdict. Once it's running, the world simply stops trying to hurt you, so long as you keep it fed. Some say that's a mercy the world never should have needed asking for in the first place.

fun.curse.language-switch.title = Language Confusion
setting.fun-language-switch-enabled.name = Enable Language Confusion
setting.fun-language-switch-enabled.description = Every few minutes the entire interface briefly switches to a random language (router included) for a few seconds, then snaps back. Works everywhere.

fun.curse.drunk-camera.title = Drunk Camera
setting.fun-drunk-camera-enabled.name = Enable Drunk Camera
setting.fun-drunk-camera-enabled.description = At random moments the camera has had one too many: the view lists and sways in slow circles for a few seconds. Works everywhere. (A true world rotation isn't possible from a mod - this is the drunk-sway next best thing.)


fun.curse.volatile-economy.title = Volatile Economy
setting.fun-volatile-economy-enabled.name = Enable Volatile Economy
setting.fun-volatile-economy-enabled.description = Block build costs swing up and down every half-minute - inflation and fire sales - but always oscillating around NORMAL, so prices never sit high forever. Your industry steers where they settle: running oil extractors stoke inflation, plastanium compressors cool it. The price is the same for everyone in the lobby (and matches what's actually charged), so every player sees the swings in their own build menu. The chat pipes up when the market shifts gear. Works in singleplayer/hosting/multiplayer.
fun.economy.up = [scarlet]Prices spike - build costs up to {0}% of normal.[]
fun.economy.down = [lime]Fire sale! Build costs down to {0}% of normal.[]

fun.curse.crooked-building.title = Crooked Construction
setting.fun-crooked-building-enabled.name = Enable Crooked Construction
setting.fun-crooked-building-enabled.description = Your buildings won't hold still. Every so often a rotatable block already on the map spontaneously spins to face a random new direction - a conveyor turns on itself, a turret goes to admire the view - and its neighbours re-route around it. Only your own team's blocks; worse as chaos climbs. Works in singleplayer/hosting.

fun.curse.deserters.title = Deserters
setting.fun-deserters-enabled.name = Enable Deserters
setting.fun-deserters-enabled.description = Every so often one of your units abandons your cause and wanders off as a neutral derelict, keeping its name (the unit you're personally piloting never deserts). You learn of it from the resignation notice. A dagger, mace or fortress standing nearby steadies morale and cuts the odds; a reign on your team stops desertion entirely and executes any derelict that wanders close; a scepter can charm a nearby derelict back into service. Works in singleplayer/hosting.
fun.deserters.message = [lightgray]{0} "{1}" has deserted. Morale is a fragile thing.[]
fun.deserters.recruited = [lime]A scepter lures {0} back into service.[]


fun.curse.turret-reworks.title = Turret Reworks (Serpulo)
setting.fun-turret-reworks-enabled.name = Enable Turret Reworks
setting.fun-turret-reworks-enabled.description = Every Serpulo turret gets its own curse: scatter loses its spread, scorch burns itself, hail goes long-and-weak, lancer aims at ground but only harms air, arc and spectre overheat and discharge, swarmer's missiles spare their target but blast its neighbours, salvo fires a 20-round burst then reloads for a minute, segment breaks its own team's shots, fuse trades damage for recoil, ripple goes short-and-strong, cyclone spins and sprays nonstop, meltdown melts your own base under the beam at triple damage. Stat changes apply on next launch; behaviours are live. Works in singleplayer/hosting.
fun.turret.heat = Overheat

fun.curse.machine-quirks.title = Machine Quirks (Serpulo)
setting.fun-machine-quirks-enabled.name = Enable Machine Quirks
setting.fun-machine-quirks-enabled.description = Assorted machine gags: impact reactors shake the whole map unstoppably (worse the more you run), RTG generators irradiate nearby units (damage + sap), thermal generators cook themselves without coolant, water pumps occasionally drown, and solar panels run at a LOSS in the dark but surge near powered illuminators. Works in singleplayer/hosting.
fun.machine.drowned = [lightgray]A pump has drowned. It knew the risks.[]
fun.economy.normal = [gray]The market settles - costs back near normal ({0}%).[]

fun.curse.factory-reworks.title = Factory Reworks (Serpulo)
setting.fun-factory-reworks-enabled.name = Enable Factory Reworks
setting.fun-factory-reworks-enabled.description = Every Serpulo crafter gets its own gag: silicon smelters/crucibles gamble (double or nothing), the kiln thaws and scorches neighbours, phase weaver hexes nearby units, surge smelter electrocutes its surroundings, cryofluid mixer freezes neighbours (put a kiln next to them to thaw), pyratite mixer self-ignites, blast mixer sometimes detonates, melter melts adjacent blocks, separator/disassembler spit scrap (disassembler rarely coughs up something valuable), spore press slows nearby units, pulverizer is deafening, coal centrifuge blackens the screen. Also: plastanium compressors curb inflation (with Volatile Economy on). Works in singleplayer/hosting.

fun.curse.chaos.title = Chaos
setting.fun-chaos-enabled.name = Enable Chaos
setting.fun-chaos-enabled.description = A global chaos level (shown as a bar above each Sacrifice Altar you build) creeps upward over time and scales how often the mod's bad/annoying effects fire - mysterious messages, the wind, deserters, sleepy drills, the drunk camera, language flips, drowning pumps. The only way to push it back down is to sacrifice the exact unit the altar is currently demanding; unit price doesn't matter, but the healthier the sacrifice and the longer your streak of correct offerings, the more chaos it quells. Amplifies other curses, so its effect depends on which of them you have on.

fun.curse.backward-belts.title = Moonwalking Conveyors
setting.fun-backward-belts-enabled.name = Enable Moonwalking Conveyors
setting.fun-backward-belts-enabled.description = Every conveyor belt's surface animates BACKWARDS while the cargo keeps riding forward. Nothing about transport actually changes - the belts just gaslight you. Purely visual, toggles instantly, works on any server. Plastanium conveyors are exempt (their belt has no animation to reverse).

fun.curse.unit-reworks.title = Unit Reworks (Serpulo)
setting.fun-unit-reworks-enabled.name = Enable Unit Reworks
setting.fun-unit-reworks-enabled.description = Name-themed gags per Serpulo unit, batch 1 (mechs): dagger is fast and vicious point-blank, mace's flame shoves and ignites, fortress entrenches when standing still (overdrive + shielded: x1.4 damage, x3 toughness), scepter demands a retinue or sulks and won't fire, only one reign per team (the newest stages a coup), nova's heal pulse is a damaging supernova flash, pulsar charges up a clockwork EMP, quasar is a searchlight with a longer harder-hitting but slower laser, vela sails the global wind (fast downwind, crawling upwind), corvus feeds on nearby deaths, caws, and spooks at enemy flyers. Batch 2: a kill within an atrax's reach bursts into a spreading plague cloud that can chain through a whole pack, spiroct's bites condense poison clouds, a wounded arkyid limps and stumbles but drills nearby spiders (overclock), flare fires periodic homing rockets that ignite the impact zone, horizon can never stop and its bombs overshoot by a couple tiles, zenith only strikes what's directly beneath it (x3 damage + fire), antumbra trails phantom copies that can eat incoming shots, and while any eclipse lives the sun goes dark - screen dims and solar panels lose power. Batch 3 (support air/naval: mono, poly, mega, quad, oct, and the sea slugs) and batch 4 (whales, plus the core defenders alpha/beta/gamma) add their own bespoke tricks too - see each unit's own tech-tree entry for specifics. Stat changes apply on next launch; behaviours are live. Works in singleplayer/hosting.
fun.units.coup = [accent]A coup! The new {0} has overthrown the old one. Long live the king.[]

fun.curse.safety-regs.title = Safety Regulations
setting.fun-safety-regs-enabled.name = Enable Safety Regulations
setting.fun-safety-regs-enabled.description = Ten "Safety Training" research nodes unlock one at a time as the campaign clears progressively harder sectors (tier 6 is printed with an Arabic "6" instead of "VI" - a certificate typo nobody ever fixed). None of them are optional: the moment a course unlocks, you have until you clear the next sector to go research it - blow through that grace period and your own units start deciding the chain of command isn't worth respecting anymore, defecting to the enemy team outright. Host/SP only.
fun.safety.mutiny = [scarlet]A {0} defects to the enemy - it never sat through its mandatory Safety Training.[]
